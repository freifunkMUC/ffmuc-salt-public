#
# Managed by salt
#
{%- from "certs/ddr_cert.jinja" import ddr_resolvers6 with context %}

{% for site in salt['pillar.get']('netbox:config_context:sites').values()|sum(start=[]) if ('br-' ~ site) in salt['pillar.get']('netbox:interfaces') %}
interface br-{{ site }}
{
        AdvSendAdvert on;
        AdvLinkMTU 1280;
        MinRtrAdvInterval 200;
        MaxRtrAdvInterval 600;
        AdvDefaultPreference high;
        {%- set ips = salt['pillar.get']('netbox:interfaces:br-' ~ site ~ ':ipaddresses') %}
        {%- if ips | length > 0 %}
        {%- for ip in ips %}
        {%- if ip['family']['value'] == 6 %}
        prefix {{ salt['network.calc_net'](ip['address']) }}
        {% endif %}
        {%- endfor %}
        {%- else %}
        prefix ::/64
        {%- endif %}
        {
                AdvOnLink on;
                AdvAutonomous on;
                AdvPreferredLifetime 3600;
                AdvValidLifetime 7200;
        };
        RDNSS {{ ddr_resolvers6 | join(' ') }}
        {
                AdvRDNSSLifetime 1200;
        };
};
{% endfor %}
