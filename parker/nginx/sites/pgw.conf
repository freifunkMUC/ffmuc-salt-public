server {
        server_name _;

        listen 80;
        listen [::]:80;

        {%- set domain = grains['id'] | regex_replace('in\.ffmuc\.net','ext.ffmuc.net') %}
        location /map/ {
                alias /srv/www/{{ domain }}/meshviewer/;
        }

        # The yanic data of this site. The pgws of the other sites read it.
        {%- set site = salt['pillar.get']('netbox:site:slug') %}
        location /map/data/{{ site }}/ {
                alias /srv/yanic/;
        }

        # The data of all sites, merged by node_id (merge-map-data.timer). The map reads it.
        location /map/data/ {
                alias /srv/yanic/merged/;
        }
}
