server {
        server_name _;

        listen 80;
        listen [::]:80;

        {%- set domain = grains['id'] | regex_replace('in\.ffmuc\.net','ext.ffmuc.net') %}
        location /map/ {
                alias /srv/www/{{ domain }}/meshviewer/;
        }

        # Per-site path: the map reads one path per site (meshviewer dataPath)
        {%- set site = salt['pillar.get']('netbox:site:slug') %}
        location /map/data/{{ site }}/ {
                alias /srv/yanic/;
        }
}
