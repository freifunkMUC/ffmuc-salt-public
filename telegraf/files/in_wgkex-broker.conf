# wgkex broker metrics (docker compose in /srv/docker/wgkex, port 5000), same format as upstream's
# contrib/grafana/telegraf-wgkex.conf: measurement "prometheus", one field per metric
[[inputs.prometheus]]
  urls = ["http://127.0.0.1:5000/metrics"]
  metric_version = 2
  interval = "30s"
  [inputs.prometheus.tags]
    wgkex_role = "broker"
