# ZFS pool health and capacity per pool (zpool list); no per-dataset metrics (dataset names are instance names)
[[inputs.exec]]
  interval = "1m"
  commands = ["zpool list -Hp -o name,health,size,allocated,free,capacity,fragmentation"]
  name_override = "zpool"
  data_format = "csv"
  csv_delimiter = "\t"
  csv_column_names = ["pool", "health", "size", "allocated", "free", "capacity", "fragmentation"]
  csv_column_types = ["string", "string", "int", "int", "int", "int", "int"]
  csv_tag_columns = ["pool", "health"]

[[inputs.zfs]]
  interval = "1m"
  kstatMetrics = ["arcstats"]
