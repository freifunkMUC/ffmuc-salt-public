# BIRD protocols, BFD sessions, WireGuard peer counts, cross-pgw traffic and Jool NAT64 counts
# of a Parker gateway.
# Read only and aggregates only, see /usr/local/bin/parker_gateway_stats.
[[inputs.exec]]
  commands = [["/usr/local/bin/parker_gateway_stats"]]
  interval = "30s"
  timeout = "25s"
  data_format = "influx"
