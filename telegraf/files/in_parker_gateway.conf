# BIRD protocols, BFD sessions, WireGuard peer counts and cross-pgw traffic of a Parker gateway.
# Read only and aggregates only, see /usr/local/bin/parker_gateway_stats.
[[inputs.exec]]
  commands = [["/usr/local/bin/parker_gateway_stats"]]
  interval = "30s"
  timeout = "15s"
  data_format = "influx"
