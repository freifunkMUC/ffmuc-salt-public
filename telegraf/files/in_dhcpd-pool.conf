{#- Gateways tagged dhcp-kea run Kea; kea-pool-stats prints the dhcpd-pools
    JSON, so the measurements stay the same. #}
{%- if 'dhcp-kea' in salt['config.get']('netbox:tag_list', []) %}
{%- set dhcp_pool_command = '/usr/local/bin/kea-pool-stats' %}
{%- else %}
{%- set dhcp_pool_command = '/usr/bin/dhcpd-pools -c /etc/dhcp/dhcpd.conf --format=j' %}
{%- endif %}
[[inputs.exec]]
   commands = [
     "{{ dhcp_pool_command }}",
   ]
   timeout = "5s"
   name_override = "dhcpd_pools_shared_networks"
   data_format = "json"
   json_query = "shared-networks"
   tag_keys = [
     "location",
   ]

[[inputs.exec]]
   commands = [
     "{{ dhcp_pool_command }}",
   ]
   timeout = "5s"
   name_override = "dhcpd_pools_subnets"
   data_format = "json"
   json_query = "subnets"
   tag_keys = [
     "location",
     "range",
   ]

[[inputs.exec]]
   commands = [
     "{{ dhcp_pool_command }}",
   ]
   timeout = "5s"
   name_override = "dhcpd_pools_summary"
   data_format = "json"
   json_query = "summary"
