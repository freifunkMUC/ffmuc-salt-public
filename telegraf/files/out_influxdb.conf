{#- Verify the InfluxDB certificate against the FFMUC CA bundle only if the host has it (certs:trust_v2),
    certs:verify_influx is set (metrics has an x509 cert) and the URL host is one of its SANs
    (certs:influx_sans). Anything else keeps insecure_skip_verify. -#}
{%- set url = salt['config.get']('netbox:config_context:influxdb:url', 'https://localhost:1234') %}
{%- set url_host = url.split('//')[-1].split('/')[0].split(':')[0] %}
{%- set certs = salt['pillar.get']('netbox:config_context:certs', {}) %}
{%- set sans = certs.get('influx_sans', ['metrics.in.ffmuc.net', 'metrics.ov.ffmuc.net', 'stats.meet.ffmuc.net']) %}
{%- set verify = certs.get('trust_v2', false) and certs.get('verify_influx', false) and url_host in sans %}
[[outputs.influxdb]]
  urls = ["{{ url }}"]
  database = "{{ salt['config.get']('netbox:config_context:influxdb:database', 'my_database') }}"
  skip_database_creation = true
  username = "{{ salt['config.get']('netbox:config_context:influxdb:username', 'my_username') }}"
  password = "{{ salt['config.get']('netbox:config_context:influxdb:password', 'SECRET') }}"
{%- if verify %}
  tls_ca = "/etc/ssl/ffmuc-ca-bundle.pem"
  insecure_skip_verify = false
{%- else %}
  insecure_skip_verify = true
{%- endif %}
