# wgkex worker metrics (metrics.worker_port in /etc/wgkex.yaml), same format as upstream's
# contrib/grafana/telegraf-wgkex.conf: measurement "prometheus", one field per metric
[[inputs.prometheus]]
  urls = ["http://127.0.0.1:9101/metrics"]
  metric_version = 2
  interval = "30s"
  [inputs.prometheus.tags]
    wgkex_role = "worker"
