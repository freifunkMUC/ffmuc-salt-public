# Expiry of the host certificate and the CA files from the certs state (field expiry in seconds, alert in Grafana "ffmuc-cert-expiry").
# x509_cert logs an error for a missing file, so only existing files are listed.
{%- set files = ['/etc/ssl/certs/' ~ grains['id'] ~ '.cert.pem', '/etc/ssl/ffmuc-ca-bundle.pem', '/etc/ssl/certs/ffmuc-cacert.pem'] %}
[[inputs.x509_cert]]
  interval = "1h"
  sources = [{% for f in files if salt['file.file_exists'](f) %}"{{ f }}"{{ ", " if not loop.last }}{% endfor %}]
