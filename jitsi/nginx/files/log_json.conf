map $remote_addr $ip_anonym1 {
 default 0.0.0;
 "~(?P<ip>(\d+)\.(\d+)\.(\d+))\.\d+" $ip;
 "~(?P<ip>[^:]+:[^:]+:[^:]+):" $ip;
}

map $remote_addr $ip_anonym2 {
 default .0;
 "~(?P<ip>(\d+)\.(\d+)\.(\d+))\.\d+" .0;
 "~(?P<ip>[^:]+:[^:]+:[^:]+):" ::;
}

map $ip_anonym1$ip_anonym2 $ip_anonymized {
 default 0.0.0.0;
 "~(?P<ip>.*)" $ip;
}


# the upper params are deprecated but here for migration purposes
log_format json_normal escape=json '{'
   '"message":"$remote_addr $host - $request_method $request_uri - $status",'
   '"timestamp": "$time_iso8601",'
   '"http_host":"$host",'
   '"port":"$server_port",'
   '"remote_addr":"$remote_addr",'
   '"remote_user":"$remote_user",'
   '"upstream_addr":"$upstream_addr",'
   '"upstream_cache_status": "$upstream_cache_status",'
   '"upstream_duration":"$upstream_response_time",'
   '"http_request_method":"$request_method",'
   '"http_request_uri":"$request_uri",'
   '"http_uri":"$uri",'
   '"http_params":"$args",'
   '"http_referer":"$http_referer",'
   '"http_user_agent":"$http_user_agent",'
   '"http_protocol_version":"$server_protocol",'
   '"response_status":"$status",'
   '"body_bytes_sent":"$body_bytes_sent",'
   '"ssl_protocol":"$ssl_protocol",'
   '"gzip_ratio":"$gzip_ratio"'
'}';


# the upper params are deprecated but here for migration purposes
log_format json_anonym escape=json '{'
   '"message":"$ip_anonymized $host - $request_method $request_uri - $status",'
   '"timestamp": "$time_iso8601",'
   '"http_host":"$host",'
   '"port":"$server_port",'
   '"remote_addr":"$ip_anonymized",'
   '"remote_user":"$remote_user",'
   '"upstream_addr":"$upstream_addr",'
   '"upstream_cache_status": "$upstream_cache_status",'
   '"upstream_duration":"$upstream_response_time",'
   '"http_request_method":"$request_method",'
   '"http_request_uri":"$request_uri",'
   '"http_uri":"$uri",'
   '"http_params":"$args",'
   '"http_referer":"$http_referer",'
   '"http_user_agent":"$http_user_agent",'
   '"http_protocol_version":"$server_protocol",'
   '"response_status":"$status",'
   '"body_bytes_sent":"$body_bytes_sent",'
   '"ssl_protocol":"$ssl_protocol",'
   '"gzip_ratio":"$gzip_ratio"'
'}';


