# Static configuration of mail01's Traefik (was data/traefik.yml on the host).
# Resolver "ov": DNS-01 through nsupdate to the authoritative servers (the
# script /opt/containers/traefik/update-dns.sh comes from the Salt state certs,
# as on the docker hosts), for names under ov.ffmuc.net that Let's Encrypt
# cannot reach over HTTP. "http" and "cloudflare" as before.
api:
  dashboard: true
ping: {}
# aliasHeadersStrategy delete: drop request headers whose name aliases another one (X_Auth_User for
# X-Auth-User), so they cannot pass for a header an auth middleware sets.
entryPoints:
  traefik:
    address: ":8080"
    http:
      aliasHeadersStrategy: delete
  http:
    address: ":80"
    http:
      aliasHeadersStrategy: delete
      redirections:
        entryPoint:
          to: "https"
          scheme: "https"
          permanent: true
          # Lowest priority, so an explicit router on `http` wins over the redirect.
          priority: 1
  https:
    address: ":443"
    http:
      aliasHeadersStrategy: delete
      middlewares:
        - crowdsec-bouncer@file
        - default-security-headers@file
    http3:
      advertisedPort: '443'
global:
  checknewversion: false
  sendanonymoususage: false
providers:
  docker:
    endpoint: "tcp://socket-proxy:2375"
    exposedByDefault: false
    network: "proxy"
  file:
    filename: "./dynamic_conf.yml"
    watch: true
  providersThrottleDuration: 10
certificatesResolvers:
  cloudflare:
    acme:
      email: hilfe@ffmuc.bayern
      storage: acme.json
      dnsChallenge:
        provider: cloudflare
        resolvers:
          - "1.1.1.1:53"
          - "1.0.0.1:53"
  http:
    acme:
      email: hilfe@ffmuc.bayern
      storage: acme.json
      httpChallenge:
        entryPoint: http
  ov:
    acme:
      email: hilfe@ffmuc.bayern
      storage: acme.json
      dnsChallenge:
        provider: exec
        propagation:
          delayBeforeChecks: 0
          disableChecks: true
log:
  level: "INFO"
  format: json
  filePath: "/var/log/traefik/traefik.log"
# Client addresses are personal data: the file is read by CrowdSec and rotated by logrotate.
# Request headers are not logged.
accessLog:
  filePath: "/var/log/traefik/access.log"
  format: json
  bufferingSize: 100
  fields:
    headers:
      defaultMode: drop
