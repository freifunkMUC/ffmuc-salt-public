# Dovecot "auth service reported temporary failure" (temp_fail), not counted by the stock dovecot filter.
[INCLUDES]
before = dovecot.conf

[Definition]
failregex = ^(?:Login aborted|Aborted login|Disconnected|Remote closed connection)%(_bypass_reject_reason)s \(auth service reported temporary failure(?:, \d+ attempts(?: in \d+ secs)?)?\)[^:]*:(?: user=<<F-USER>[^>]*</F-USER>>,)?(?: method=\S+,)? rip=<ADDR>(?:[^>]*(?:, session=<\S+>)?)\s*$
