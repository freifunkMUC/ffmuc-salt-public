# DKIM signing by Rspamd (OpenDKIM off since DMS 17). Keys: the former OpenDKIM keys, on the host in
# config/rspamd/dkim/ (DMS chowns that directory to _rspamd at start); check_pubkey skips a key if DNS differs.
enabled = true;
sign_authenticated = true;
sign_local = true;
use_domain = "header";
use_esld = true;
allow_username_mismatch = true;
check_pubkey = true;
selector = "mail";

domain {
  ffmuc.bayern { path = "/tmp/docker-mailserver/rspamd/dkim/ffmuc.bayern-mail.private"; selector = "mail"; }
  ffmuc.net { path = "/tmp/docker-mailserver/rspamd/dkim/ffmuc.net-mail.private"; selector = "mail"; }
  fnmuc.net { path = "/tmp/docker-mailserver/rspamd/dkim/fnmuc.net-mail.private"; selector = "mail"; }
}
