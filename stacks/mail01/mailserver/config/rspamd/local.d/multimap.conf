# Local blacklists, scored since the review of 20.10.2026 (observe mode, score
# 0, from 14.10.2026 to then). Both symbols sit in the group "local_blacklist"
# (rspamd/local.d/groups.conf) so that they are tuned together; the lists are narrow on
# purpose (rspamd/maps/local_bl_*), extend them only with evidence from the
# history. Rspamd's actions: greylist 4, add header 6, reject 15 (DMS).
BAD_SUBJECT_BL {
  type = "header";
  header = "subject";
  regexp = true;
  map = "/etc/rspamd/maps/local_bl_subject.inc";
  description = "Blacklist for common spam subjects";
  group = "local_blacklist";
  score = 5.0;
}

SENDER_TLD_FROM {
  type = "from";
  filter = 'email:domain:tld';
  prefilter = true;
  map = "/etc/rspamd/maps/local_bl_tld_from.map.inc";
  regexp = true;
  description = "Local tld from blacklist";
  group = "local_blacklist";
  # Alone it only reaches greylisting; with any other hit the mail is a spam.
  score = 4.0;
}
