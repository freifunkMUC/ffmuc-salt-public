# docker-mailserver, Roundcube with its Postgres, autodiscover and MTA-STS of
# mail01 as one project "mailserver" (/opt/containers/mailserver): container
# and network names (mailserver_default, mailserver_ip6net) stay as they are.
# Data, state, logs, certs/ (mail_crypt key pair), the database and the
# mutable part of config/ (accounts, aliases, quotas, DKIM keys, setup.sh) stay
# on the host; the files of this directory are mounted over them.
# Secrets come from the Periphery secrets (see the Stack in stacks.toml).
services:
  mailserver:
    image: docker.io/mailserver/docker-mailserver:16.0.1@sha256:d0fe7668defe157aad57ea31b1707ad1e2fb57d7a91bdf17cbdf876549946c86
    hostname: mail01
    domainname: fnmuc.net
    env_file: mailserver.env
    restart: unless-stopped
    stop_grace_period: 1m
    security_opt:
      - no-new-privileges:true
    # Own recursive resolver: URIBL and others refuse queries through shared resolvers.
    dns:
      - 192.168.53.2
    ports:
      - "25:25"    # SMTP  (explicit TLS => STARTTLS)
      - "143:143"  # IMAP4 (explicit TLS => STARTTLS)
      - "465:465"  # ESMTP (implicit TLS)
      - "587:587"  # ESMTP (explicit TLS => STARTTLS)
      - "993:993"  # IMAP4 (implicit TLS)
      - "110:110"  # POP3
      - "995:995"  # POP3 (with TLS)
    volumes:
      # Data, state and keys stay on the host.
      - /opt/containers/mailserver/data:/var/mail
      - /opt/containers/mailserver/state:/var/mail-state
      - /opt/containers/mailserver/logs:/var/log/mail
      - /etc/localtime:/etc/localtime:ro
      - /opt/containers/mailserver/config/:/tmp/docker-mailserver/
      - /opt/containers/mailserver/certs/:/certs
      - /opt/containers/traefik/data/acme.json:/etc/letsencrypt/acme.json:ro
      # Configuration from this directory, over the host's config/ (accounts,
      # aliases, quotas and the DKIM keys stay there).
      - ./config/dovecot.cf:/tmp/docker-mailserver/dovecot.cf:ro
      - ./config/fail2ban-jail.cf:/tmp/docker-mailserver/fail2ban-jail.cf:ro
      - ./config/opendkim/KeyTable:/tmp/docker-mailserver/opendkim/KeyTable:ro
      - ./config/opendkim/SigningTable:/tmp/docker-mailserver/opendkim/SigningTable:ro
      - ./config/opendkim/TrustedHosts:/tmp/docker-mailserver/opendkim/TrustedHosts:ro
      - ./config/rspamd/local.d/multimap.conf:/etc/rspamd/local.d/multimap.conf
      - ./config/rspamd/local.d/groups.conf:/etc/rspamd/local.d/groups.conf
      - ./config/rspamd/local.d/classifier-bayes.conf:/etc/rspamd/local.d/classifier-bayes.conf:ro
      - ./config/rspamd/maps/from_hidden_chars.map:/etc/rspamd/maps/from_hidden_chars.map:ro
      - ./config/rspamd/maps/local_bl_subject_map.inc:/etc/rspamd/maps/local_bl_subject.inc
      - ./config/rspamd/maps/local_bl_tld_from.map.inc:/etc/rspamd/maps/local_bl_tld_from.map.inc
      - ./config/rspamd/plugins.d/kits_header_google_group.lua:/etc/rspamd/plugins.d/kits_header_google_group.lua
      - ./config/rspamd/modules.d/kits_header_google_group.conf:/etc/rspamd/modules.d/kits_header_google_group.conf
      - ./config/rspamd/override.d/composites.conf:/etc/rspamd/override.d/composites.conf
      - ./cron/sa-learn:/etc/cron.d/sa-learn
    cap_add:
      - NET_ADMIN
    networks:
      ip6net: {}
      default: {}
      resolver:
        ipv4_address: 192.168.53.3
    depends_on:
      - unbound
    # Checks every service that mailserver.env switches on (new in 16.0.0).
    healthcheck:
      test: dms-healthcheck
      timeout: 10s
      start_period: 1m

  unbound:
    image: docker.io/klutchell/unbound:1.26.1@sha256:9a3939ca33d6d3b42b81a70391bb8e43f0a08d2bd7a3fdffb43d427493345c36
    restart: unless-stopped
    # Not read_only: unbound updates root.key (RFC 5011).
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    networks:
      resolver:
        ipv4_address: 192.168.53.2

  autodiscover:
    image: ghcr.io/freifunkmuc/autodiscover-email-settings:2.0.2@sha256:be0fd56a7c257d53870b6de790f9657577a480589af03a560591b24ca4a3f1ac
    restart: unless-stopped
    environment:
      - COMPANY_NAME=Freie Netze München e.V.
      - SUPPORT_URL=https://autodiscover.fnmuc.net
      - DOMAIN=fnmuc.net
      # IMAP configuration (host mandatory to enable)
      - IMAP_HOST=IMAP.fnmuc.net
      - IMAP_PORT=143
      - IMAP_SOCKET=STARTTLS
      # SMTP configuration (host mandatory to enable)
      - SMTP_HOST=SMTP.fnmuc.net
      - SMTP_PORT=587
      - SMTP_SOCKET=STARTTLS
      # Apple mobile config identifiers (identifier mandatory to enable)
      - PROFILE_IDENTIFIER=net.fnmuc.autodiscover
      - PROFILE_UUID=64263270-c3c3-43f7-9a81-65b75184c831
      - MAIL_UUID=1ec26cc6-7dc4-48bd-a2ef-d2a92e135201
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.autodiscover.entrypoints=https"
      - "traefik.http.routers.autodiscover.rule=Host(`autoconfig.fnmuc.net`, `autodiscover.fnmuc.net`)"
      - "traefik.http.routers.autodiscover.tls=true"
      - "traefik.http.routers.autodiscover.tls.certresolver=http"
      - "traefik.http.routers.autodiscover.service=autodiscover"
      - "traefik.http.routers.autodiscover.middlewares=default@file"
      - "traefik.http.services.autodiscover.loadbalancer.server.port=8000"
      - "traefik.docker.network=proxy"
    networks:
      - proxy

  # Roundcube, apache image as www-data on port 8000. On every start the
  # entrypoint copies the program into /var/www/html (not kept), writes the
  # configuration from the environment and roundcube_config/*.php (the list of
  # files is written at start, so a new file needs a recreate) and updates the
  # database schema.
  roundcubemail:
    image: roundcube/roundcubemail:1.7.4-apache-nonroot@sha256:22a0ed6be0d08a30fbe68301e7bb91dfa7811c4a884eb91a75e92076ca0be097
    container_name: roundcubemail
    restart: unless-stopped
    depends_on:
      - roundcubedb
    volumes:
      - ./roundcube_config:/var/roundcube/config:ro
    environment:
      - ROUNDCUBEMAIL_DB_TYPE=pgsql
      - ROUNDCUBEMAIL_DB_HOST=roundcubedb
      - ROUNDCUBEMAIL_DB_NAME=roundcube
      - ROUNDCUBEMAIL_DB_USER=roundcube
      - ROUNDCUBEMAIL_DB_PASSWORD=${ROUNDCUBE_DB_PASSWORD:?set ROUNDCUBE_DB_PASSWORD}
      # Encrypts the IMAP password in the session; a new key only logs
      # everybody out.
      - ROUNDCUBEMAIL_DES_KEY=${ROUNDCUBE_DES_KEY:?set ROUNDCUBE_DES_KEY}
      - ROUNDCUBEMAIL_SKIN=elastic
      - ROUNDCUBEMAIL_DEFAULT_HOST=tls://mail01-v4.fnmuc.net
      - ROUNDCUBEMAIL_SMTP_SERVER=tls://mail01-v4.fnmuc.net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8000/"]
      start_period: 2m
      start_interval: 5s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.roundcube.entrypoints=https"
      - "traefik.http.routers.roundcube.rule=Host(`mail01.fnmuc.net`, `mail01-v4.fnmuc.net`, `webmail.fnmuc.net`, `webmail.mail01.fnmuc.net`, `imap.fnmuc.net`, `smtp.fnmuc.net`)"
      - "traefik.http.routers.roundcube.tls=true"
      - "traefik.http.routers.roundcube.tls.certresolver=http"
      - "traefik.http.routers.roundcube.service=roundcube"
      - "traefik.http.routers.roundcube.middlewares=default@file"
      - "traefik.http.services.roundcube.loadbalancer.server.port=8000"
      - "traefik.docker.network=proxy"
    networks:
      - default
      - proxy

  roundcubedb:
    image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    container_name: roundcubedb
    restart: unless-stopped
    volumes:
      - /opt/containers/mailserver/database:/var/lib/postgresql/18/docker
    environment:
      - POSTGRES_DB=roundcube
      - POSTGRES_USER=roundcube
      - POSTGRES_PASSWORD=${ROUNDCUBE_POSTGRES_PASSWORD:?set ROUNDCUBE_POSTGRES_PASSWORD}

  mta-sts:
    image: nginx:1.31.3-alpine@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752
    restart: unless-stopped
    volumes:
      - ./mta-sts:/usr/share/nginx/html:ro
      - ./mta-sts.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mta-sts.entrypoints=https"
      - "traefik.http.routers.mta-sts.rule=Host(`mta-sts.fnmuc.net`)"
      - "traefik.http.routers.mta-sts.tls=true"
      - "traefik.http.routers.mta-sts.tls.certresolver=http"
      - "traefik.http.routers.mta-sts.middlewares=default@file"
      - "traefik.http.routers.mta-sts.service=mta-sts"
      - "traefik.http.services.mta-sts.loadbalancer.server.port=80"
      - "traefik.docker.network=proxy"
    networks:
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null http://localhost || exit 1"]
      interval: 2s
      timeout: 30s
      retries: 15

networks:
  proxy:
    external: true
  resolver:
    ipam:
      config:
        - subnet: 192.168.53.0/29
  ip6net:
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd00:cafe:face:feee::/64
