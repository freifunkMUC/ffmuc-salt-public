---
services:
  postgresql:
    image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    environment:
      POSTGRES_USER: "cfssl"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DATABASE: "cfssl"
    volumes:
      - /srv/docker/cfssl/volumes/postgresql18:/var/lib/postgresql  # 18 layout: data in 18/docker below the mount
    restart: always
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  cfssl:
    image: cfssl/cfssl:v1.7.1@sha256:a32a9048078819d3035f5dc46637346a0e7da9df297ab234994c9a80cde10b98
    depends_on:
      - postgresql
    environment:
      VIRTUAL_HOST: ca.ov.ffmuc.net
      CERT_NAME: shared
      CFSSL_USE_DB: "yes"
      CFSSL_CA_CERTIFICATE: "/data/ca.pem"
      CFSSL_CA_PRIVATE_KEY: "/data/ca-key.pem"
    volumes:
      # db_config.json has the database password, so config/ stays on the host
      - /srv/docker/cfssl/config:/config
      - /srv/docker/cfssl/volumes/cfssl/data:/data
    entrypoint: ["cfssl", "serve"]
    command: ["-address", "0.0.0.0", "-ca", "/data/ca.pem", "-ca-key", "/data/ca-key.pem", "-port", "8080", "-config", "/config/ca_root_config.json", "-db-config", "/config/db_config.json"]
    restart: on-failure
    ports:
      - 8080:8080
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cfssl-secure.entrypoints=https"
      - "traefik.http.routers.cfssl-secure.rule=Host(`ca.ov.ffmuc.net`)"
      - "traefik.http.routers.cfssl-secure.tls=true"
      - "traefik.http.routers.cfssl-secure.tls.certresolver=http"
      - "traefik.http.routers.cfssl-secure.service=cfssl"
      - "traefik.http.services.cfssl.loadbalancer.server.port=8080"
      - "traefik.docker.network=proxy"
    networks:
      - default
      - proxy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/v1/cfssl/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  proxy:
    external: true
