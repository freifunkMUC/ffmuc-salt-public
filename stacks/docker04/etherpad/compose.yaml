---
services:
  etherpad:
    image: etherpad/etherpad:3.3.12@sha256:e240564a6897845ee665b02c35853564c0866aafc4641f04c94ce82813373194
    restart: unless-stopped
    user: "5001:0"
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      TITLE: Etherpad Freifunk Muenchen
      DEFAULT_PAD_TEXT: "Willkommen im Etherpad von Freifunk Muenchen."
      PORT: "9001"
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?}
      DB_TYPE: mysql
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_NAME: etherpad
      DB_USER: etherpad
      DB_PASS: ${DB_PASS:?}
      DB_CHARSET: utf8mb4
      TRUST_PROXY: "true"
      NODE_ENV: production
      IMPORT_EXPORT_RATE_LIMIT_WINDOW: "1"
      IMPORT_EXPORT_MAX_REQ_PER_IP: "100000"
    ports:
      - "0.0.0.0:8081:9001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 2
  mariadb:
    image: mariadb:11.8.9-noble@sha256:2d2f4095530294735a857cfe22bb101e19b0849b416911c796ec4aa81b164a62
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
      MYSQL_DATABASE: etherpad
      MYSQL_USER: etherpad
      MYSQL_PASSWORD: ${DB_PASS:?}
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - /srv/docker/mysql-etherpad/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 1m
      start_interval: 2s
      interval: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 1m
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 2
