---
services:
  etherpad:
    image: etherpad/etherpad:3.3.16@sha256:72759acc995ee66c7b4eb8e93fe017b882b29005beb86320fc12bd7334d0e4d3
    restart: unless-stopped
    user: "5001:0"
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      TITLE: Etherpad Freifunk Muenchen
      DEFAULT_PAD_TEXT: "Willkommen im Etherpad von Freifunk Muenchen."
      PORT: "9001"
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?}
      DB_TYPE: mysql
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_NAME: etherpad
      DB_USER: etherpad
      DB_PASS: ${DB_PASS:?}
      DB_CHARSET: utf8mb4
      TRUST_PROXY: "true"
      NODE_ENV: production
      IMPORT_EXPORT_RATE_LIMIT_WINDOW: "1"
      IMPORT_EXPORT_MAX_REQ_PER_IP: "100000"
    ports:
      - "0.0.0.0:8081:9001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 2
  mariadb:
    image: mariadb:12.3.3-noble@sha256:d46e102fa8b9b72bfcdeb56f9dd538742092119dc8b11f31fe662605cd234cd9
    command: ["--innodb-snapshot-isolation=OFF"]  # 11.8 behaviour; 12.3 defaults to ON
    restart: unless-stopped
    user: "999:999"
    cap_drop:
      - ALL
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
      MYSQL_DATABASE: etherpad
      MYSQL_USER: etherpad
      MYSQL_PASSWORD: ${DB_PASS:?}
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - /srv/docker/mysql-etherpad/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 1m
      start_interval: 2s
      interval: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 1m
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 2
