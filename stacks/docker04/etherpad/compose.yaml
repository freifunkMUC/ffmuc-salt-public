---
services:
  etherpad:
    image: etherpad/etherpad:3.3.10@sha256:ebe37b915aa25072b0bd13d94bd83ae6a4eb58cb81e876b217b230addb6eb8b4
    restart: always
    depends_on:
      - mariadb
    environment:
      - TITLE
      - DEFAULT_PAD_TEXT
      - PORT=9001
      - ADMIN_PASSWORD
      - ADMIN_USER
      - DB_HOST
      - DB_PORT
      - DB_USER
      - DB_TYPE
      - DB_PASS
      - DB_NAME
      - DB_CHARSET
      - API_KEY
      - SESSION_REQUIRED
      - TRUST_PROXY=true
      - NODE_ENV=production
      - IMPORT_EXPORT_RATE_LIMIT_WINDOW=1
      - IMPORT_EXPORT_MAX_REQ_PER_IP=100000
    ports:
      - "0.0.0.0:${HOST_PORT}:9001"
  mariadb:
    image: mariadb:11.8.9-noble@sha256:2d2f4095530294735a857cfe22bb101e19b0849b416911c796ec4aa81b164a62
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASS}
      - MARIADB_AUTO_UPGRADE=1
    volumes:
      - /srv/docker/mysql-etherpad/mysql:/var/lib/mysql
