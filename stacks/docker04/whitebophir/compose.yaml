---
services:
  whiteboard:
    image: lovasoa/wbo:v2.18.33@sha256:5b41f048ae7e36ba06c51e003b28c65b6ab448d01b18fa4d79018674496e3314
    restart: unless-stopped
    environment:
      # nginx on the webfrontends proxies /draw/ and passes X-Forwarded-For
      # from haproxy. Without this, all users share one rate limit bucket.
      - WBO_IP_SOURCE=X-Forwarded-For
      - WBO_TRUST_PROXY_HOPS=1
      # Public path is https://ffmuc.net/draw/; nginx removes the prefix.
      # Without it, v2 redirects to /boards/... outside of /draw/.
      - WBO_BASE_PATH=/draw
    ports:
      - "5001:80"
    volumes:
      # v1 boards are board-<name>.json. v2 writes board-<name>.svg next to
      # them on first load and keeps the JSON file.
      - /srv/docker/whitebophir/boards:/opt/app/server-data:z
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
