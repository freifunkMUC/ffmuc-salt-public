# Apache prefork workers for DokuWiki, replacing the image's default of 150.
# With 150, one wave of scrapers ran 150 PHP processes and took every core of
# docker04; 40 is plenty for the wiki's real visitors on the 4 CPUs the
# container gets. Requests beyond that wait in the listen queue.
<IfModule mpm_prefork_module>
	StartServers            5
	MinSpareServers         5
	MaxSpareServers         10
	MaxRequestWorkers       40
	MaxConnectionsPerChild  1000
</IfModule>
