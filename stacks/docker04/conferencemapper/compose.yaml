---
services:
  conferencemapper:
    image: ghcr.io/freifunkmuc/conferencemapper:latest@sha256:e51e4f03cc3c417e039294d1d3ded883441e6b2ee281c2b50ea13b2f55ef090d
    user: "10001:10001"
    restart: unless-stopped
    ports:
      - "10.8.0.31:8001:8001"
    volumes:
      - /srv/docker/conferencemapper/data:/app/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.5
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8001/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
