---
services:
  conferencemapper:
    image: ghcr.io/freifunkmuc/conferencemapper:latest@sha256:9138a4135f56824fdfc15540e217ed2014943e4814ce1f0fecf9c467ccdbf50f
    user: "10001:10001"
    restart: unless-stopped
    ports:
      - "10.8.0.31:8001:8001"
    volumes:
      - /srv/docker/conferencemapper/data:/app/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.5
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8001/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
