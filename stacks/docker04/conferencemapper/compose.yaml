---
services:
  conferencemapper:
    image: ghcr.io/krombel/conferencemapper:master@sha256:e2b7cf5a26524c78c4d7e6e83b40af086fefd47ff12b1a7db9a81d52e6bea399
    restart: always
    ports:
      - "8001:8001"
    volumes:
      - /srv/docker/conferencemapper/data:/app/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8001/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
