---
services:
  conferencemapper:
    image: ghcr.io/freifunkmuc/conferencemapper:latest@sha256:1b24cd9c0e9ae4668e109db1e69386f81bf41595fbdb83f011976d36ee297df5
    user: "10001:10001"
    restart: unless-stopped
    ports:
      - "10.8.0.31:8001:8001"
    volumes:
      - /srv/docker/conferencemapper/data:/app/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.5
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8001/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
