---
services:
  broker:
    image: ghcr.io/freifunkmuc/wgkex:v0.4.0@sha256:efb1d4be038e70343adbc994bc0c732d7b7ffa43fdddc5a6fc03aa6ec3a8933d
    command: broker
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - /srv/docker/wgkex/config/broker/wgkex.yaml:/etc/wgkex.yaml
    environment:
      WGKEX_DOMAINS: "ffmuc_freising, ffmuc_gauting, ffmuc_muc_cty, ffmuc_muc_nord, ffmuc_muc_ost, ffmuc_muc_sued, ffmuc_muc_west, ffmuc_uml_nord, ffmuc_uml_ost, ffmuc_uml_sued, ffmuc_uml_west, ffmuc_welt, ffmuc_ffdon_test"
      WGKEX_DOMAIN_PREFIXES: "ffmuc_, ffdon_, ffwert_"
      WGKEX_DEBUG: DEBUG
      MQTT_BROKER_URL: mqtt
      MQTT_BROKER_PORT: "1883"
      MQTT_USERNAME: ""
      MQTT_PASSWORD: ""
      MQTT_KEEPALIVE: "5"
      MQTT_TLS: "False"
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection((\"127.0.0.1\", 5000), 4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m

  mqtt_cluster:
    image: emqx/emqx:5.8.9@sha256:35b46f7aa7a0d51f3959e4344221ac5ec7f948b03e43099286b6c40a07bb393b
    container_name: mqtt_cluster
    restart: unless-stopped
    environment:
      - EMQX_NODE_NAME=emqx@docker04.ov.ffmuc.net
      - EMQX_CLUSTER__DISCOVERY_STRATEGY=static
      - EMQX_CLUSTER__STATIC__SEEDS=[emqx@docker04.ov.ffmuc.net,emqx@docker05.ov.ffmuc.net,emqx@docker06.ov.ffmuc.net,emqx@docker07.ov.ffmuc.net]
      - EMQX_NODE__COOKIE=${EMQX_NODE__COOKIE}
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 5s
      timeout: 25s
      retries: 5
    ports:
      - "1883:1883"
      - "4370:4370"
      - "5369:5369"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
