%% wgkex MQTT ACL (EMQX file source). First matching rule wins, everything else is denied.
%% Topics: wgkex wgkex/broker/app.py and wgkex/worker/mqtt.py; parker = Parker pilot on pgw01.

%% wgkex brokers (docker04-07)
{allow, {username, "wgkex-broker"}, publish, ["wireguard/+/+", "wireguard-worker/+/+/remove", "wireguard-worker/+/rebalance", "wireguard-broker/+/assignment"]}.
{allow, {username, "wgkex-broker"}, subscribe, ["wireguard-metrics/#", "wireguard-worker/+/status", "wireguard-worker/+/+/data", "wireguard-broker/+/assignment"]}.

%% wgkex workers (gateways); the client id is the worker's hostname
{allow, {username, "wgkex-worker"}, publish, ["wireguard-worker/${clientid}/status", "wireguard-worker/${clientid}/+/data", "wireguard-metrics/+/${clientid}/connected_peers"]}.
{allow, {username, "wgkex-worker"}, subscribe, ["wireguard/+/${clientid}", "wireguard/+/all", "wireguard-worker/${clientid}/+/remove", "wireguard-worker/${clientid}/rebalance", "wireguard-worker/+/+/data"]}.

%% Parker pilot (pgw01)
{allow, {username, "parker"}, all, ["parker/#"]}.
{allow, {username, "parker"}, publish, ["wireguard-broker/pgw01/status"]}.
{allow, {username, "parker"}, subscribe, ["wireguard-worker/+/status", "wireguard-worker/+/+/data", "wireguard-metrics/+/+/connected_peers", "wireguard-broker/+/status"]}.

{deny, all}.
