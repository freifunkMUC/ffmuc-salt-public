---
x-db-env: &db-env
  MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
  MARIADB_PASSWORD: ${MARIADB_PASSWORD}
  MARIADB_DATABASE: matomo
  MARIADB_USER: matomo
  MATOMO_DATABASE_ADAPTER: mysql
  MATOMO_DATABASE_TABLES_PREFIX: matomo_
  MATOMO_DATABASE_USERNAME: matomo
  MATOMO_DATABASE_PASSWORD: ${MARIADB_PASSWORD}
  MATOMO_DATABASE_DBNAME: matomo

services:
  db:
    image: mariadb:12.3.3-noble@sha256:d46e102fa8b9b72bfcdeb56f9dd538742092119dc8b11f31fe662605cd234cd9
    command: --max-allowed-packet=64MB
    restart: always
    volumes:
      - /srv/docker/matomo/database:/var/lib/mysql
    environment:
      <<: *db-env
      MYSQL_ROOT_PASSWORD: ""
      MARIADB_AUTO_UPGRADE: "true"

  matomo-app:
    image: matomo:5.14.2-fpm-alpine@sha256:19625e90ba4f3d6b3b03fd516fe4e356d1a074b942906d88bc8899e51c80d93e
    restart: always
    links:
      - db
    volumes:
      - /srv/docker/matomo/matomo:/var/www/html
    tmpfs:
      - /var/www/html/tmp:uid=82,gid=82
    environment:
      <<: *db-env
      MATOMO_DATABASE_HOST: db

  matomo-cron:
    image: matomo:5.14.2-fpm-alpine@sha256:19625e90ba4f3d6b3b03fd516fe4e356d1a074b942906d88bc8899e51c80d93e
    restart: unless-stopped
    depends_on:
      - matomo-app
    volumes:
      - /srv/docker/matomo/matomo:/var/www/html:ro
    tmpfs:
      - /var/www/html/tmp:uid=82,gid=82
    entrypoint: "sh -c 'while true; do php console core:archive --url=matomo.ffmuc.net; sleep 600; done'"

  matomo-web:
    image: nginx:1.31.8-alpine@sha256:785835ea65db4bba6f021acc0f3be91b0fef76a53fe41f8588c6698d2aed0606
    restart: always
    volumes:
      - /srv/docker/matomo/matomo:/var/www/html:ro
      # see https://github.com/matomo-org/matomo-nginx
      - /srv/docker/matomo/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - 8092:80
