---
services:
  excalidraw-backend:
    image: jitsi/excalidraw-backend:2026.10.0@sha256:8cc8b24329f609bfcec68a581c2c73fd74a7dd0b8bcb9efcecaa693a9d507bb1
    restart: always
    ports:
      - "0.0.0.0:8090:80"
      - "0.0.0.0:8091:9090" # metrics
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "node", "-e", "require(\"http\").get(\"http://127.0.0.1:80/\", r => process.exit(r.statusCode < 500 ? 0 : 1)).on(\"error\", () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
