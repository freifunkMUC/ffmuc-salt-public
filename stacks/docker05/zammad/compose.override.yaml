---
# FFMUC changes on top of zammad/zammad-docker-compose v17.5.5.
# compose.yaml is the upstream docker-compose.yml, unchanged.
# Images are pinned here. The other values that compose.yaml reads from
# .env (POSTGRES_USER, NGINX_EXPOSE_PORT, ...) and the secret POSTGRES_PASS
# come from the Komodo Stack environment.
x-zammad-image: &zammad-image ghcr.io/zammad/zammad:7.3.0-0001@sha256:4208261ceecd31b70ba28ce03c5c7250af75ba8dd4f04d5ba4a3958087b3bd8d

x-ffmuc-app-mounts: &ffmuc-app-mounts
  - /srv/docker/zammad-backup:/var/tmp/zammad:ro
  - /srv/docker/zammad-storage:/opt/zammad/storage

# Services that run as a non-root user. Backup, PostgreSQL and Redis start
# as root (dump into the uid 1000 backup dir, chown in the entrypoint) and
# only get no-new-privileges.
x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

services:
  zammad-backup:
    image: *zammad-image
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    volumes:
      - /srv/docker/zammad-backup:/var/tmp/zammad
      - /srv/docker/zammad-storage:/opt/zammad/storage
  zammad-init:
    <<: *hardening
    image: *zammad-image
    volumes: *ffmuc-app-mounts
    mem_limit: 1g
  zammad-nginx:
    <<: *hardening
    image: *zammad-image
    # favicon and app icon, nginx serves them from public/
    volumes:
      - /srv/docker/zammad-backup:/var/tmp/zammad:ro
      - /srv/docker/zammad-storage:/opt/zammad/storage
      - ./branding/favicon.ico:/opt/zammad/public/favicon.ico:ro
      - ./branding/apple-touch-icon.png:/opt/zammad/public/apple-touch-icon.png:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "-o", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    mem_limit: 256m
  zammad-railsserver:
    <<: *hardening
    image: *zammad-image
    volumes: *ffmuc-app-mounts
    mem_limit: 2g
  zammad-scheduler:
    <<: *hardening
    image: *zammad-image
    volumes: *ffmuc-app-mounts
    mem_limit: 2g
  zammad-websocket:
    <<: *hardening
    image: *zammad-image
    volumes: *ffmuc-app-mounts
    mem_limit: 1g
  zammad-memcached:
    <<: *hardening
    mem_limit: 384m
    image: memcached:1.6.45-alpine@sha256:084fb554292d1447bc2c68b80c2331b98834514f56c866bc21a61be3c2ee376d
  zammad-redis:
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    image: redis:8.12.0-alpine@sha256:5af80107c1eeecb484a2269b80a26d12bfa6521787da4663bd9f19f60a163483
    user: "999:1000"
    cap_drop:
      - ALL
  zammad-postgresql:
    # new directory for Postgres 18 (data in 18/docker below the mount, !override drops the base file's mount); the old ones stay as the way back
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    image: postgres:19.0-alpine@sha256:cac45fb483caee3668946088a1c0532db89d5285c28dbfeac889b4068296e06f
    user: "70:70"  # no read_only: compose cannot place upstream's inline `configs:` (initdb) into a read-only container
    cap_drop:
      - ALL
    volumes: !override
      - /srv/docker/postgresql18-zammad:/var/lib/postgresql:z
  zammad-elasticsearch:
    <<: *hardening
    mem_limit: 4g
    image: elasticsearch:9.5.7@sha256:e6d7ea460831636c630a48611b661af5a4fc8e6e1afedd683a81d4ad10486008
    environment:
      # Same value as upstream plus -XX:-UseBASE64Intrinsics, also when ELASTICSEARCH_JAVA_OPTS is set.
      # CVE-2026-114938 (Java4Shell) stopgap, remove when the image ships a fixed JDK.
      ES_JAVA_OPTS: "${ELASTICSEARCH_JAVA_OPTS:--Xms1g -Xmx1g} -XX:-UseBASE64Intrinsics"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    volumes:
      - /srv/docker/elasticsearch9-zammad/data:/usr/share/elasticsearch/data
