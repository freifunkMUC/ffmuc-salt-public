---
# FFMUC changes on top of zammad/zammad-docker-compose v17.5.4.
# compose.yaml is the upstream docker-compose.yml, unchanged.
# Images are pinned here. The other values that compose.yaml reads from
# .env (POSTGRES_USER, NGINX_EXPOSE_PORT, ...) and the secret POSTGRES_PASS
# come from the Komodo Stack environment.
x-zammad-image: &zammad-image ghcr.io/zammad/zammad:7.2.2-0028@sha256:ff8086858d775651b246b77343fb72994de27c1deeea1fb8b86e5a2958685140

# Zammad 7.2.x joins the change lines of webhook notifications with a
# literal '\n' (zammad/zammad#6449, fixed for 7.3). Patch that line at
# start; it matches nothing once the image has the fix. Remove with 7.3.
x-webhook-newline-fix: &webhook-newline-fix
  - sh
  - -c
  - |
    f=/opt/zammad/app/services/service/template/interpolation/interpolator/webhook/track/notification.rb
    sed -i "s/\.join('\\\\n')/.join(\"\\\\n\")/" "$$f"
    exec /opt/zammad/bin/docker-entrypoint "$$@"
  - zammad-entrypoint

x-ffmuc-app-mounts: &ffmuc-app-mounts
  - /srv/docker/zammad-backup:/var/tmp/zammad:ro
  - /srv/docker/zammad-storage:/opt/zammad/storage

services:
  zammad-backup:
    image: *zammad-image
    volumes:
      - /srv/docker/zammad-backup:/var/tmp/zammad
      - /srv/docker/zammad-storage:/opt/zammad/storage
  zammad-init:
    image: *zammad-image
    volumes: *ffmuc-app-mounts
  zammad-nginx:
    image: *zammad-image
    volumes: *ffmuc-app-mounts
  zammad-railsserver:
    image: *zammad-image
    entrypoint: *webhook-newline-fix
    volumes: *ffmuc-app-mounts
  zammad-scheduler:
    image: *zammad-image
    entrypoint: *webhook-newline-fix
    volumes: *ffmuc-app-mounts
  zammad-websocket:
    image: *zammad-image
    volumes: *ffmuc-app-mounts
  zammad-memcached:
    image: memcached:1.6.45-alpine@sha256:6a089e37cbb8acd75c80c6c0667fe57ec54db68782fb1b3afb1d0eb265e50070
  zammad-redis:
    image: redis:7.4.12-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
  zammad-postgresql:
    image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    volumes:
      - /srv/docker/postgresql-zammad/data:/var/lib/postgresql/data:z
  zammad-elasticsearch:
    image: elasticsearch:8.19.23@sha256:ef5cafd961d7e273f13fed8def82e63c5ae0491106b5eecb5a69aa12d64f089b
    volumes:
      - /srv/docker/elasticsearch-zammad/data:/usr/share/elasticsearch/data
