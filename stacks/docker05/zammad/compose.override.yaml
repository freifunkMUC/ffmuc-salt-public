---
# FFMUC changes on top of zammad/zammad-docker-compose v17.5.5.
# compose.yaml is the upstream docker-compose.yml, unchanged.
# Images are pinned here. The other values that compose.yaml reads from
# .env (POSTGRES_USER, NGINX_EXPOSE_PORT, ...) and the secret POSTGRES_PASS
# come from the Komodo Stack environment.
x-zammad-image: &zammad-image ghcr.io/zammad/zammad:7.2.2-0038@sha256:61e95f981e3124908ad08f94da79872d89d0ac60f7679b11b7cd3d6d0ebcdd7a

# Zammad 7.2.x joins the change lines of webhook notifications with a
# literal '\n' (zammad/zammad#6449, fixed for 7.3). Patch that line at
# start; it matches nothing once the image has the fix. Remove with 7.3.
x-webhook-newline-fix: &webhook-newline-fix
  - sh
  - -c
  - |
    f=/opt/zammad/app/services/service/template/interpolation/interpolator/webhook/track/notification.rb
    sed -i "s/\.join('\\\\n')/.join(\"\\\\n\")/" "$$f"
    exec /opt/zammad/bin/docker-entrypoint "$$@"
  - zammad-entrypoint

x-ffmuc-app-mounts: &ffmuc-app-mounts
  - /srv/docker/zammad-backup:/var/tmp/zammad:ro
  - /srv/docker/zammad-storage:/opt/zammad/storage

# Services that run as a non-root user. Backup, PostgreSQL and Redis start
# as root (dump into the uid 1000 backup dir, chown in the entrypoint) and
# only get no-new-privileges.
x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

services:
  zammad-backup:
    image: *zammad-image
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    volumes:
      - /srv/docker/zammad-backup:/var/tmp/zammad
      - /srv/docker/zammad-storage:/opt/zammad/storage
  zammad-init:
    <<: *hardening
    image: *zammad-image
    volumes: *ffmuc-app-mounts
    mem_limit: 1g
  zammad-nginx:
    <<: *hardening
    image: *zammad-image
    # favicon and app icon, nginx serves them from public/
    volumes:
      - /srv/docker/zammad-backup:/var/tmp/zammad:ro
      - /srv/docker/zammad-storage:/opt/zammad/storage
      - ./branding/favicon.ico:/opt/zammad/public/favicon.ico:ro
      - ./branding/apple-touch-icon.png:/opt/zammad/public/apple-touch-icon.png:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "-o", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    mem_limit: 256m
  zammad-railsserver:
    <<: *hardening
    image: *zammad-image
    entrypoint: *webhook-newline-fix
    volumes: *ffmuc-app-mounts
    mem_limit: 2g
  zammad-scheduler:
    <<: *hardening
    image: *zammad-image
    entrypoint: *webhook-newline-fix
    volumes: *ffmuc-app-mounts
    mem_limit: 2g
  zammad-websocket:
    <<: *hardening
    image: *zammad-image
    volumes: *ffmuc-app-mounts
    mem_limit: 1g
  zammad-memcached:
    <<: *hardening
    mem_limit: 384m
    image: memcached:1.6.45-alpine@sha256:084fb554292d1447bc2c68b80c2331b98834514f56c866bc21a61be3c2ee376d
  zammad-redis:
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    image: redis:8.10.3-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
    user: "999:1000"
    cap_drop:
      - ALL
  zammad-postgresql:
    # new directory for Postgres 18 (data in 18/docker below the mount, !override drops the base file's mount); the old ones stay as the way back
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    image: postgres:18.6-alpine@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
    user: "70:70"
    cap_drop:
      - ALL
    volumes: !override
      - /srv/docker/postgresql18-zammad:/var/lib/postgresql:z
  zammad-elasticsearch:
    <<: *hardening
    mem_limit: 4g
    image: elasticsearch:9.5.5@sha256:e69cac81b35b20473d2d86455cb9bcb42873c2824cb1ce25835871302d1c18fa
    volumes:
      - /srv/docker/elasticsearch9-zammad/data:/usr/share/elasticsearch/data
