---
services:
  diun:
    image: crazymax/diun:4.34.0@sha256:f350e8e7cc0e3b33d500e2fc462ac9273d8954327f32e2501b34b6bef5a0de3e
    hostname: docker05-diun
    restart: always
    depends_on:
      - socket-proxy
    networks:
      - default
      - socket-proxy
    volumes:
      - /srv/docker/diun/data:/data
    environment:
      - DIUN_PROVIDERS_DOCKER_ENDPOINT=tcp://socket-proxy:2375
      - TZ=Europe/Berlin
      - LOG_LEVEL=info
      - LOG_JSON=false
      - DIUN_WATCH_WORKERS=20
      - DIUN_WATCH_SCHEDULE=42 3 * * *
      - DIUN_PROVIDERS_DOCKER=true
      - DIUN_PROVIDERS_DOCKER_WATCHSTOPPED=true
      - DIUN_PROVIDERS_DOCKER_WATCHBYDEFAULT=true
      - DIUN_NOTIF_SLACK_WEBHOOKURL=${DIUN_SLACK_WEBHOOK_URL}
      - DIUN_NOTIF_SLACK_RENDERFIELDS=false
      - >-
        DIUN_NOTIF_SLACK_TEMPLATEBODY={{ .Meta.Hostname }}: `{{ .Entry.Image }}`
        {{ if (eq .Entry.Status "new") }}newly added{{ else }}updated{{ end }}.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m

  # read-only Docker API for diun: version, container list/inspect, image inspect; no POST
  socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:3.4.8-r0-ls107@sha256:6beb1743581ec3b2ed1a2bafd617e8c7a1d7ae2fe835293e333327618fc2b925
    restart: always
    read_only: true
    tmpfs:
      - /run
    networks:
      - socket-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - VERSION=1
      - POST=0
      - EVENTS=0
      - PING=1
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2375/_ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  socket-proxy:
    internal: true
