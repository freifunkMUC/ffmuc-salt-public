---
# Defaults for every router of this Traefik (file provider, watched: changes apply without a restart).
tls:
  options:
    # Mozilla "intermediate": TLS 1.2 and 1.3. Go fixes the TLS 1.3 suites, this list is for TLS 1.2.
    default:
      minVersion: VersionTLS12
      cipherSuites:
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256

http:
  middlewares:
    # On the https entry point (traefik.yml). Traefik overwrites these headers in every response, also
    # a backend's own value: before adding a host, check that no backend sends a stricter HSTS
    # (includeSubDomains/preload). HSTS without includeSubDomains (names below must be able to stay on
    # plain HTTP), nosniff. No Referrer-Policy (the browser default is the same, backends set stricter
    # ones) and no frame restriction (Jitsi, Collabora and others are embedded by other sites).
    security-headers:
      headers:
        stsSeconds: 31536000
        contentTypeNosniff: true
