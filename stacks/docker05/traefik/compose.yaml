---
# Traefik for docker05. Static configuration in traefik.yml (read at start: restart the stack after a
# change), dynamic defaults in dynamic/ (watched, apply live). ACME account and certificates and the DNS
# hook stay on the host in /srv/docker/traefik; the access log goes to /srv/docker/traefik/logs
# (rotated by the logrotate state, not shipped to Graylog).
services:
  traefik:
    image: traefik:v3.7.16@sha256:c8a121e4bb1347e8fd52657fab12f2cb70b68f8a018895e2068f92c9e519b9c2
    container_name: traefik
    restart: unless-stopped
    depends_on:
      - socket-proxy
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
      - socket-proxy
    ports:
      - 80:80
      - 443:443
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./dynamic:/etc/traefik/dynamic:ro
      - /srv/docker/traefik/acme.json:/acme.json
      - /srv/docker/traefik/update-dns.sh:/tmp/update-dns.sh:ro
      - /srv/docker/traefik/logs:/logs
    environment:
      - EXEC_PATH=/tmp/update-dns.sh
    labels:
      - traefik.enable=true
      - traefik.http.middlewares.traefik-auth.basicauth.users=${TRAEFIK_DASHBOARD_USERS}
      - traefik.http.routers.traefik-secure.entrypoints=https
      - traefik.http.routers.traefik-secure.rule=Host(`docker05.ov.ffmuc.net`)
      - traefik.http.routers.traefik-secure.middlewares=traefik-auth
      - traefik.http.routers.traefik-secure.tls=true
      - traefik.http.routers.traefik-secure.tls.certresolver=http
      - traefik.http.routers.traefik-secure.service=api@internal
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # read-only Docker API for Traefik's docker provider: version, ping, container list/inspect, events; no POST
  socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:3.4.7-r0-ls104@sha256:4e5e59efd3338205561c54262581992036e5a36ccca97d487b1d4ec41f9adc58
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /run
    networks:
      - socket-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - CONTAINERS=1
      - EVENTS=1
      - PING=1
      - VERSION=1
      - POST=0
    deploy:
      resources:
        limits:
          memory: 64M

networks:
  proxy:
    external: true
  socket-proxy:
    internal: true
