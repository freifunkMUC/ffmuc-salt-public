---
services:
  db:
    image: mariadb:12.3.3-noble@sha256:d46e102fa8b9b72bfcdeb56f9dd538742092119dc8b11f31fe662605cd234cd9
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW --innodb_read_only_compressed=OFF
    restart: unless-stopped
    volumes:
      - /srv/docker/nextcloud/database:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_INITDB_SKIP_TZINFO=1
      - MARIADB_AUTO_UPGRADE=1
    networks:
      - default

  redis:
    image: redis:8.10.3-alpine@sha256:21090af93f8324db2f0f0f4f38a7c60369d47d917e000c3423d89d2ae2883537
    networks:
      - default
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}

  app:
    image: nextcloud:35.0.2-fpm@sha256:245ebca5d5ae0f6f7b5a5f6c8b936691607011177f4f70bcc076cc0f87ad4207
    restart: unless-stopped
    depends_on:
      - db
      - redis
    environment:
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_HOST=db
    volumes:
      - /srv/docker/nextcloud/data:/var/www/html
      - ./config/zz-docker.conf:/usr/local/etc/php-fpm.d/zz-docker.conf
      - ./config/ldap.conf:/etc/ldap/ldap.conf
    networks:
      - default

  web:
    image: nginx:1.31.8-alpine@sha256:b2f80f8f88146b0772fdcc7d92cea621aa8c2889fa8d07ed61d4884fcea53e09
    ports:
      - 8089:80
    depends_on:
      - app
    volumes:
      - /srv/docker/nextcloud/nginx.conf:/etc/nginx/nginx.conf:ro
    volumes_from:
      - app
    restart: unless-stopped
    networks:
      - default
