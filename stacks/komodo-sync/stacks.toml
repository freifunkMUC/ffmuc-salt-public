[[stack]]
name = "docker04-etherpad"
tags = ["ffmuc"]
deploy = false
[stack.config]
server = "docker04"
project_name = "etherpad"
repo = "freifunkMUC/ffmuc-salt-public"
branch = "main"
run_directory = "stacks/docker04/etherpad"
file_paths = ["compose.yaml"]
environment = """
MYSQL_HOST = [[ETHERPAD_MYSQL_HOST]]
MYSQL_ROOT_PASSWORD = [[ETHERPAD_MYSQL_ROOT_PASSWORD]]
MYSQL_USER = [[ETHERPAD_MYSQL_USER]]
MYSQL_PASSWORD = [[ETHERPAD_MYSQL_PASSWORD]]
TITLE = [[ETHERPAD_TITLE]]
DEFAULT_PAD_TEXT = [[ETHERPAD_DEFAULT_PAD_TEXT]]
HOST_PORT = [[ETHERPAD_HOST_PORT]]
ADMIN_PASSWORD = [[ETHERPAD_ADMIN_PASSWORD]]
ADMIN_USER = [[ETHERPAD_ADMIN_USER]]
DB_TYPE = [[ETHERPAD_DB_TYPE]]
DB_HOST = [[ETHERPAD_DB_HOST]]
DB_PORT = [[ETHERPAD_DB_PORT]]
DB_USER = [[ETHERPAD_DB_USER]]
DB_PASS = [[ETHERPAD_DB_PASS]]
DB_NAME = [[ETHERPAD_DB_NAME]]
DB_CHARSET = [[ETHERPAD_DB_CHARSET]]
NODE_ENV = [[ETHERPAD_NODE_ENV]]
IMPORT_EXPORT_RATE_LIMIT_WINDOW = [[ETHERPAD_IMPORT_EXPORT_RATE_LIMIT_WINDOW]]
IMPORT_EXPORT_MAX_REQ_PER_IP = [[ETHERPAD_IMPORT_EXPORT_MAX_REQ_PER_IP]]
"""

