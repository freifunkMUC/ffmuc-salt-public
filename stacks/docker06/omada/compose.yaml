---
services:
  omada-controller:
    container_name: omada-controller
    image: mbentley/omada-controller:6.3.0.111@sha256:7ffded380f2e5806bc92f4ae47518c2a60ee3b46f3bf03ebd0725078e960cb49
    environment:
      - TZ=Europe/Berlin
      - JAVA_MAX_HEAP_SIZE=3g
      - JAVA_TOOL_OPTIONS=-XX:+ExitOnOutOfMemoryError
      - MANAGE_HTTP_PORT=8088
      - MANAGE_HTTPS_PORT=8043
      - PORTAL_HTTP_PORT=8088
      - PORTAL_HTTPS_PORT=8043
      - SHOW_SERVER_LOGS=true
      - SHOW_MONGODB_LOGS=false
      - ROOTLESS=true
      - SSL_CERT_NAME="tls.crt"
      - SSL_KEY_NAME="tls.key"
    network_mode: host
    # Rootless mode: 508 owns data/, work/ and logs/; all ports are above 1024.
    user: "508:508"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - /srv/docker/omada/data:/opt/tplink/EAPController/data
      - /srv/docker/omada/work:/opt/tplink/EAPController/work
      - /srv/docker/omada/logs:/opt/tplink/EAPController/logs
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 10g
    mem_limit: 10g # must be consistent with deploy.resources.limits.memory
    memswap_limit: 10g # if set to same value as mem_limit, swap is disabled
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "--no-check-certificate", "https://127.0.0.1:8043/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5m
