---
services:
  mastodon-paywall:
    image: ghcr.io/freifunkmuc/mastodon-paywall:main@sha256:b27017d3cddd966876e902f846ce9e8d221ebc3ab13bfbd7ebeeb466a3ef8d96
    container_name: mastodon-paywall
    restart: always
    environment:
      API_TOKEN: ${API_TOKEN}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET}
      PAYPAL_PLAN_ID: P-7AC70324RL420101MMPUURQQ
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID}
    ports:
      - 3001:3000
    volumes:
      # Persists the default sqlite database (DATABASE_URL) across restarts.
      # Not needed if DATABASE_URL points at an external Postgres/MySQL.
      - mastodon-paywall-data:/app/data

volumes:
  mastodon-paywall-data:
