---
# Based on docker-compose.yml of mastodon/mastodon with local changes (OpenSearch,
# split Sidekiq queues). The secrets of .env.production and TRUSTED_PROXY_IP
# come from Komodo.
x-mastodon-secrets: &mastodon-secrets
  DB_PASS: ${DB_PASS}
  SECRET_KEY_BASE: ${SECRET_KEY_BASE}
  OTP_SECRET: ${OTP_SECRET}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
  SMTP_PASSWORD: ${SMTP_PASSWORD}
  ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ${ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY}
  ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ${ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT}
  ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ${ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY}
  TRUSTED_PROXY_IP: ${TRUSTED_PROXY_IP}

services:
  es:
    image: public.ecr.aws/opensearchproject/opensearch:2.19.7@sha256:3bfa1ec74d56928c2e018033d45c460ce2c0ea65a5cedd577de3102326c31b89
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - bootstrap.memory_lock=true
      - cluster.name=es-mastodon
      - "OPENSEARCH_JAVA_OPTS=-Xms3g -Xmx3g"
    mem_limit: 6g
    ulimits:
      memlock: {soft: -1, hard: -1}
      nofile: {soft: 65536, hard: 65536}
    volumes:
      - /srv/docker/mastodon-data/opensearch:/usr/share/opensearch/data
    networks:
      - internal_network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf localhost:9200/_cluster/health || exit 1"]
  db:
    restart: always
    image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    #image: pgautoupgrade/pgautoupgrade:17-alpine
    shm_size: 2gb
    command: postgres -c 'max_connections=500' -c 'shared_buffers=8776MB' -c 'effective_cache_size=15328MB' -c 'maintenance_work_mem=2GB' -c 'effective_io_concurrency=500' # 48 + 5 + 80 + 140 + 100
    networks:
      - internal_network
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres']
    volumes:
      - /srv/docker/mastodon-data/postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: mastodon_production
      POSTGRES_USER: mastodon

  redis:
    restart: always
    image: redis:7.4.12-alpine@sha256:338fbfc036dc5517ac0b04d6de21521085935336e565f223406180e9d84166e2
    networks:
      - internal_network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
    volumes:
      - /srv/docker/mastodon-data/redis:/data

  web:
    # You can uncomment the following line if you want to not use the prebuilt image, for example if you have local code changes
    # build: .
    image: ghcr.io/mastodon/mastodon:v4.7.4@sha256:8cbc9c9ffa595c4ced3854b63b8f173251be710f9bbf2d369926023c19666311
    restart: always
    env_file: env/mastodon.env
    command: bundle exec puma -C config/puma.rb
    # command: bash -c "rm -f /mastodon/tmp/pids/server.pid; bundle exec rails s -p 3000" # replace upstream in  v4.3.0
    environment:
      <<: *mastodon-secrets
      WEB_CONCURRENCY: "24"
      MAX_THREADS: "16"
    networks:
      - external_network
      - internal_network
    healthcheck:
      # prettier-ignore
      test: ['CMD-SHELL', "curl -s --noproxy localhost localhost:3000/health | grep -q 'OK' || exit 1"]
    ports:
      - '3000:3000'
    depends_on:
      - db
      - redis
      # - es
    expose:
      - "3000"
    volumes:
      - /srv/docker/mastodon-data/public/system:/mastodon/public/system

  streaming:
    image: ghcr.io/mastodon/mastodon-streaming:v4.7.4@sha256:b896be8bc93db513695c3ebac8442c09453065ab1be06dfc49fe3c16a91c825c
    restart: always
    env_file: env/mastodon.env
    environment:
      <<: *mastodon-secrets
    command: node ./streaming/index.js
    networks:
      - external_network
      - internal_network
    healthcheck:
      # prettier-ignore
      test: ['CMD-SHELL', "curl -s --noproxy localhost localhost:4000/api/v1/streaming/health | grep -q 'OK' || exit 1"]
    ports:
      - '4000:4000'
    expose:
      - "4000"
    depends_on:
      - db
      - redis

  sidekiq-pull:
    # You can uncomment the following line if you want to not use the prebuilt image, for example if you have local code changes
    # build: .
    image: ghcr.io/mastodon/mastodon:v4.7.4@sha256:8cbc9c9ffa595c4ced3854b63b8f173251be710f9bbf2d369926023c19666311
    restart: always
    env_file: env/mastodon.env
    command: bundle exec sidekiq -q push -q pull -c 50
    environment:
      <<: *mastodon-secrets
      DB_POOL: "50"
    depends_on:
      - db
      - redis
    networks:
      - external_network
      - internal_network
    volumes:
      - /srv/docker/mastodon-data/public/system:/mastodon/public/system
    healthcheck:
      test: ['CMD-SHELL', "ps aux | grep '[s]idekiq\ 8' || false"]

  sidekiq-ingress:
    image: ghcr.io/mastodon/mastodon:v4.7.4@sha256:8cbc9c9ffa595c4ced3854b63b8f173251be710f9bbf2d369926023c19666311
    restart: always
    env_file: env/mastodon.env
    environment:
      <<: *mastodon-secrets
      DB_POOL: "40"
    command: bundle exec sidekiq -q ingress -c 40
    depends_on:
      - db
      - redis
    networks:
      - external_network
      - internal_network
    volumes:
      - /srv/docker/mastodon-data/public/system:/mastodon/public/system
    healthcheck:
      test: ['CMD-SHELL', "ps aux | grep '[s]idekiq\ 8' || false"]

  sidekiq-scheduler:
    image: ghcr.io/mastodon/mastodon:v4.7.4@sha256:8cbc9c9ffa595c4ced3854b63b8f173251be710f9bbf2d369926023c19666311
    restart: always
    env_file: env/mastodon.env
    environment:
      <<: *mastodon-secrets
      DB_POOL: "40"
    command: bundle exec sidekiq -q scheduler -c 40
    depends_on:
      - db
      - redis
    networks:
      - external_network
      - internal_network
    volumes:
      - /srv/docker/mastodon-data/public/system:/mastodon/public/system
    healthcheck:
      test: ['CMD-SHELL', "ps aux | grep '[s]idekiq\ 8' || false"]


  sidekiq-default:
    image: ghcr.io/mastodon/mastodon:v4.7.4@sha256:8cbc9c9ffa595c4ced3854b63b8f173251be710f9bbf2d369926023c19666311
    restart: always
    env_file: env/mastodon.env
    environment:
      <<: *mastodon-secrets
      DB_POOL: "50"
    # sidekiq will work through 'default' until it's empty, then 'mailers', ..., then 'ingress' to help out sidekiq-ingress when it's full
    command: bundle exec sidekiq -q default -q mailers -q fasp -c 50
    depends_on:
      - db
      - redis
    networks:
      - external_network
      - internal_network
    volumes:
      - /srv/docker/mastodon-data/public/system:/mastodon/public/system
    healthcheck:
      test: ['CMD-SHELL', "ps aux | grep '[s]idekiq\ 8' || false"]


  ## Uncomment to enable federation with tor instances along with adding the following ENV variables
  ## http_hidden_proxy=http://privoxy:8118
  ## ALLOW_ACCESS_TO_HIDDEN_SERVICE=true
  # tor:
  #   image: sirboops/tor
  #   networks:
  #      - external_network
  #      - internal_network
  #
  # privoxy:
  #   image: sirboops/privoxy
  #   volumes:
  #     - /srv/docker/mastodon-data/priv-config:/opt/config
  #   networks:
  #     - external_network
  #     - internal_network

networks:
  external_network:
  internal_network:
    internal: true
  proxy:
    external: true
    driver: bridge
    attachable: true
