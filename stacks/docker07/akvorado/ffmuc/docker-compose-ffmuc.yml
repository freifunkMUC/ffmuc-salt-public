---
# FFMUC overrides for akvorado on docker07 (v2026.10.0, 23.10.2026). docker/ is the untouched upstream tag; every
# local deviation lives in this file, the last entry of file_paths of the Komodo Stack. Placed outside docker/ so that
# the next upgrade can replace docker/ wholesale. Needs Docker Compose >= 2.24 (!override, !reset).
#  - images pinned by digest here (upstream's versions.yml has `akvorado:main` and floating tags)
#  - config/ is not in git (outlet.yaml has the SNMP community): absolute bind mount to the host directory
#  - geoip is pulled by digest only, no local build (upstream's Dockerfile and script are not in git)
#  - upstream's own traefik service is not used: the host Traefik (/srv/docker/traefik) serves the console
#  - network `default` without upstream's fixed class-E subnets and br-akvorado (as before this upgrade)
#  - only the console is on network proxy; its router labels as before (flow.ov.ffmuc.net, http + https)
#  - every other service: traefik.enable=false (their routers use upstream's entry point `private`, which does
#    not exist on the host Traefik; upstream's console metrics router without host rule would be public)
#  - inlet publishes 4739/udp (IPFIX) and 6343/udp (sFlow) as before, not upstream's extra 2055/udp (NetFlow); outlet
#    publishes 10179/tcp (BMP) as before; the upgrade script asserts exactly these three published ports
networks:
  default: !override {}
  proxy:
    external: true

services:
  traefik:
    profiles: [disabled]
  kafka:
    image: apache/kafka:4.3.2@sha256:852a0d49fc4e656b022e7f23785411802c9a088c78a7c5e39f33969de9c227a7
  redis:
    image: valkey/valkey:9.1@sha256:3add1a336a920ea54770a001ab6feb3da5fceea96a40373a3a2cd469b815f0b7
  clickhouse:
    image: clickhouse/clickhouse-server:26.8@sha256:d426d2f612e1e189c90f9a3f8dcd85a03c6851273833817a296bb327e63aa7a7  # one-line switch: CH_IMAGE=... in the upgrade script (default 26.8; 25.8 digest is in its header)
    labels:
      - traefik.enable=false
  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0@sha256:7cda86a33344160309fdb65146332e4da65db81a945614f2fe32e210803f6fd1
    labels:
      - traefik.enable=false
  geoip:
    image: quay.io/akvorado/ipinfo-geoipupdate:latest@sha256:c5142d58f822a622c3ef29da7eb2080945c93bf1d12bf41ed683a051859eef9a
    build: !reset null
  akvorado-orchestrator:
    image: &akvorado quay.io/akvorado/akvorado:2026.10.1@sha256:6454527fcbe27a88f5031e6ad46b9b1514c285ef7548ae18ad95d69b114fc818
    volumes: !override
      - /srv/docker/akvorado/config:/etc/akvorado:ro
    labels:
      - traefik.enable=false
  akvorado-inlet:
    image: *akvorado
    ports: !override
      - 4739:4739/udp
      - 6343:6343/udp
    labels:
      - traefik.enable=false
  akvorado-outlet:
    image: *akvorado
    # BMP port 10179/tcp stays published as today (explicit, the upgrade script asserts it); no BMP routing provider is
    # configured today, so nothing listens behind it until `outlet.routing` is set.
    ports: !override
      - 10179:10179/tcp
    labels:
      - traefik.enable=false
  # Console router labels: the one place to change when a forward-auth (Keycloak) middleware comes: define the
  # middleware here and put it into traefik.http.routers.akvorado-console-secure.middlewares (and the http router).
  akvorado-console:
    image: *akvorado
    networks:
      - default
      - proxy
    labels: !override
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.services.akvorado-console.loadbalancer.server.port=8080
      - "traefik.http.routers.akvorado-console.rule=Host(`flow.ov.ffmuc.net`)"
      - traefik.http.routers.akvorado-console.middlewares=akvorado-console-headers
      - traefik.http.middlewares.akvorado-console-https-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.akvorado-console-headers.headers.customrequestheaders.X-Forwarded-Proto=https
      - traefik.http.middlewares.akvorado-console-headers.headers.customrequestheaders.X-Forwarded-For=https
      - traefik.http.middlewares.akvorado-console-headers.headers.customrequestheaders.X-Forwarded-Port=443
      - traefik.http.routers.akvorado-console-secure.entrypoints=https
      - "traefik.http.routers.akvorado-console-secure.rule=Host(`flow.ov.ffmuc.net`)"
      - traefik.http.routers.akvorado-console-secure.tls=true
      - traefik.http.routers.akvorado-console-secure.tls.certresolver=http
      - metrics.enable=true
      - metrics.path=/api/v0/metrics
