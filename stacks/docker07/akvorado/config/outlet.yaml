---
geoip:
  optional: true
  asn-database:
    - /usr/share/GeoIP/asn.mmdb
  geo-database:
    - /usr/share/GeoIP/country.mmdb
networks:
  networks:
    2001:678:e68::/48:
      name: ffmuc-v6-e68
      asn: 212567
    2001:678:ed0::/48:
      name: ffmuc-v6-ed0
      asn: 212567
    5.1.66.0/24:
      name: ffmuc-vie01-public
      asn: 212567
    185.150.99.0/24:
      name: ffmuc-muc01-public
      asn: 212567
    46.226.127.0/24:
      name: ffmuc-big-sites-pool
      asn: 212567
    141.98.138.0/24:
      name: ffmuc-big-sites-pool-vie
      asn: 212567
core:
  classifier-cache-duration: 10m
  default-sampling-rate: 1000
  exporter-classifiers:
    - ClassifySiteRegex(Exporter.Name, "^[^-]+-(\\w+)", "$1")
    - ClassifyRegion("europe")
    - ClassifyTenant("acme")
    - ClassifyRole("edge")
  interface-classifiers:
    - 'ClassifyConnectivityRegex(Interface.Description, "^(?i)(transit|pni|ppni|ix):? ", "$1") &&

      ClassifyProviderRegex(Interface.Description, "^\\S+?\\s(\\S+)", "$1") &&

      ClassifyExternal()

      '
    - ClassifyInternal()
metadata:
  providers:
    - type: snmp
      credentials: !include "snmp-credentials.yaml"
      agents:
        172.31.0.65: 10.8.0.35
        172.31.0.33: 10.8.0.3
