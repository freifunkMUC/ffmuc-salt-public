---
# Login in front of internal web UIs (Nebula only, *.ov.ffmuc.net) with Keycloak realm noc:
# LDAP group Admin and OTP, as Komodo. Each Traefik references it as forwardAuth middleware
# `noc-auth@file` (dynamic/noc-auth.yml); oauth2-proxy answers 202 for a valid session, otherwise
# it sends the browser to Keycloak and back. One cookie for .ov.ffmuc.net, so one login covers
# every UI behind it.
# Secrets (client secret from Keycloak, cookie secret) come from the Periphery as [[...]].
services:
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.6@sha256:c3415e8660af553f5e18f5d90db050614c02493c0ac6260ac59442f6d9b12048
    restart: unless-stopped
    environment:
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      # X-Forwarded-* only from Traefik: network proxy on docker07 (subnet from the daemon's address
      # pool, not pinned in stacks/docker07/traefik; check here if that network is ever recreated)
      OAUTH2_PROXY_TRUSTED_PROXY_IPS: 172.16.1.0/24
      OAUTH2_PROXY_PROVIDER: keycloak-oidc
      OAUTH2_PROXY_OIDC_ISSUER_URL: https://keycloak.ffmuc.net/realms/noc
      OAUTH2_PROXY_CLIENT_ID: oauth2-proxy
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET}
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
      OAUTH2_PROXY_REDIRECT_URL: https://auth.ov.ffmuc.net/oauth2/callback
      # noc only lets members of LDAP group Admin in; checked here again
      OAUTH2_PROXY_ALLOWED_ROLES: Admin
      # the directory has no mail attribute: the username stands in for the e-mail
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_OIDC_EMAIL_CLAIM: preferred_username
      OAUTH2_PROXY_INSECURE_OIDC_ALLOW_UNVERIFIED_EMAIL: "true"
      # forwardAuth: no upstream, 202 for a valid session
      OAUTH2_PROXY_UPSTREAMS: static://202
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_COOKIE_NAME: _oauth2_noc
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET}
      OAUTH2_PROXY_COOKIE_DOMAINS: .ov.ffmuc.net
      OAUTH2_PROXY_WHITELIST_DOMAINS: .ov.ffmuc.net
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      # as noc's SSO session: at most 10 h, refreshed (role still granted) every 30 min
      OAUTH2_PROXY_COOKIE_EXPIRE: 10h
      OAUTH2_PROXY_COOKIE_REFRESH: 30m
      # logins only, no per-request log (client addresses)
      OAUTH2_PROXY_REQUEST_LOGGING: "false"
      OAUTH2_PROXY_STANDARD_LOGGING: "true"
      OAUTH2_PROXY_AUTH_LOGGING: "true"
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.oauth2-proxy.rule=Host(`auth.ov.ffmuc.net`)
      - traefik.http.routers.oauth2-proxy.entrypoints=https
      - traefik.http.routers.oauth2-proxy.tls=true
      - traefik.http.routers.oauth2-proxy.tls.certresolver=http
      - traefik.http.services.oauth2-proxy.loadbalancer.server.port=4180
    # distroless image (uid 65532, no shell): no healthcheck command; Komodo shows the state
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  proxy:
    external: true
