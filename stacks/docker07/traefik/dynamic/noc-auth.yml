---
# Login with Keycloak realm noc (LDAP group Admin + OTP) through oauth2-proxy on docker07
# (stacks/docker07/oauth2-proxy). Use as `noc-auth@file` on a router of an internal UI.
# No fallback: while auth.ov.ffmuc.net is down, the UIs behind it answer with an error.
http:
  middlewares:
    noc-auth:
      forwardAuth:
        address: https://auth.ov.ffmuc.net/
        # X-Forwarded-* come from Traefik itself (entry point trustedIPs); oauth2-proxy only trusts Traefik
        trustForwardHeader: false
        maxResponseBodySize: 65536
        authResponseHeaders:
          - X-Auth-Request-User
          - X-Auth-Request-Preferred-Username
        # Pass refreshed session cookies (COOKIE_REFRESH) from the 202 back to the browser; oauth2-proxy splits large
        # cookies into _0, _1, ... Fetch/XHR calls get the redirect to Keycloak once the session ends (reload the page).
        addAuthCookiesToResponse:
          - _oauth2_noc
          - _oauth2_noc_0
          - _oauth2_noc_1
          - _oauth2_noc_2
