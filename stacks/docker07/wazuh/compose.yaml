---
# Wazuh 4.14 single node (manager, indexer, dashboard), after upstream wazuh-docker v4.14.10 single-node.
# Setup, secrets and rollback: README.md. Secrets come from Komodo, never from this directory.
# Deviations from upstream: images by digest; certs, users and secrets are not in the repo; 1514/1515 only on the
# Nebula address; 55000 and 9200 not published; dashboard behind noc-auth on wazuh.ov.ffmuc.net, TLS ends at Traefik.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  # root and default capabilities as upstream: s6 and the wazuh daemons need them
  wazuh.manager:
    image: wazuh/wazuh-manager:4.14.10@sha256:eabfa7ee4e63acb51c2130fa0583e30f843d030b091cf45a4fbd93d78fa21517
    hostname: wazuh.manager
    restart: unless-stopped
    ulimits:
      memlock: {soft: -1, hard: -1}
      nofile: {soft: 655360, hard: 655360}
    environment:
      INDEXER_URL: '"https://wazuh.indexer:9200"'  # sed puts it into filebeat.yml as a list item
      INDEXER_USERNAME: admin
      INDEXER_PASSWORD: ${WAZUH_INDEXER_PASSWORD:?}
      FILEBEAT_SSL_VERIFICATION_MODE: full
      SSL_CERTIFICATE_AUTHORITIES: /etc/ssl/root-ca.pem
      SSL_CERTIFICATE: /etc/ssl/filebeat.pem
      SSL_KEY: /etc/ssl/filebeat.key
      API_USERNAME: wazuh-wui
      API_PASSWORD: ${WAZUH_API_PASSWORD:?}
      # read by entrypoint-scripts/10-secrets.sh
      AUTHD_PASS: ${WAZUH_AUTHD_PASS:?}
      MATTERMOST_HOOK_URL: ${WAZUH_MATTERMOST_HOOK_URL:?}
    ports:
      - "10.8.0.16:1514:1514"  # agents (Nebula only)
      - "10.8.0.16:1515:1515"  # enrollment (Nebula only)
    volumes:
      - /srv/docker/wazuh/manager/api_configuration:/var/ossec/api/configuration
      - /srv/docker/wazuh/manager/etc:/var/ossec/etc
      - /srv/docker/wazuh/manager/logs:/var/ossec/logs
      - /srv/docker/wazuh/manager/queue:/var/ossec/queue
      - /srv/docker/wazuh/manager/var_multigroups:/var/ossec/var/multigroups
      - /srv/docker/wazuh/manager/integrations:/var/ossec/integrations
      - /srv/docker/wazuh/manager/active_response:/var/ossec/active-response/bin
      - /srv/docker/wazuh/manager/agentless:/var/ossec/agentless
      - /srv/docker/wazuh/manager/wodles:/var/ossec/wodles
      - /srv/docker/wazuh/manager/filebeat_etc:/etc/filebeat
      - /srv/docker/wazuh/manager/filebeat_var:/var/lib/filebeat
      - /srv/docker/wazuh/certs/root-ca-manager.pem:/etc/ssl/root-ca.pem:ro
      - /srv/docker/wazuh/certs/wazuh.manager.pem:/etc/ssl/filebeat.pem:ro
      - /srv/docker/wazuh/certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key:ro
      # copied over /var/ossec at every start (cont-init 0-wazuh-init, mount_files)
      - ./config/wazuh_manager.conf:/wazuh-config-mount/etc/ossec.conf:ro
      - ./config/local_rules.xml:/wazuh-config-mount/etc/rules/local_rules.xml:ro
      - ./entrypoint-scripts:/entrypoint-scripts:ro
    mem_limit: 4g
    pids_limit: 4096
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    depends_on:
      wazuh.indexer:
        condition: service_healthy

  wazuh.indexer:
    image: wazuh/wazuh-indexer:4.14.10@sha256:1d2aeadb9de88c6d17ce12030606425deca5a210cdf5c87008843da38eb629ea
    hostname: wazuh.indexer
    restart: unless-stopped
    environment:
      # heap 4 GiB (half of mem_limit); -XX:-UseBASE64Intrinsics is the JDK stopgap of the other Java stacks
      OPENSEARCH_JAVA_OPTS: -Xms4g -Xmx4g -XX:-UseBASE64Intrinsics
    ulimits:
      memlock: {soft: -1, hard: -1}
      nofile: {soft: 65536, hard: 65536}
    volumes:
      # own LV, owned by 1000:1000
      - /srv/docker/wazuh/indexer/data:/var/lib/wazuh-indexer
      - /srv/docker/wazuh/certs/root-ca.pem:/usr/share/wazuh-indexer/config/certs/root-ca.pem:ro
      - /srv/docker/wazuh/certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.key:ro
      - /srv/docker/wazuh/certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.pem:ro
      - /srv/docker/wazuh/certs/admin.pem:/usr/share/wazuh-indexer/config/certs/admin.pem:ro
      - /srv/docker/wazuh/certs/admin-key.pem:/usr/share/wazuh-indexer/config/certs/admin-key.pem:ro
      - ./config/wazuh.indexer.yml:/usr/share/wazuh-indexer/config/opensearch.yml:ro
      # hashes of the pillar passwords, written by the init-users service
      - /srv/docker/wazuh/internal_users.yml:/usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9200"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 2m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 8g
    pids_limit: 4096
    logging: *logging

  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:4.14.10@sha256:4d48be7210a291c00a2bd148cbd8bd61a25876e947b81790fd03f7d2aabda95a
    hostname: wazuh.dashboard
    restart: unless-stopped
    environment:
      DASHBOARD_USERNAME: kibanaserver
      DASHBOARD_PASSWORD: ${WAZUH_DASHBOARD_PASSWORD:?}
      WAZUH_API_URL: https://wazuh.manager
      API_USERNAME: wazuh-wui
      API_PASSWORD: ${WAZUH_API_PASSWORD:?}
    volumes:
      - /srv/docker/wazuh/certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem:ro
      - ./config/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml:ro
      # wazuh.yml (API login) is generated from the environment on first start; custom assets as upstream
      - /srv/docker/wazuh/dashboard/config:/usr/share/wazuh-dashboard/data/wazuh/config
      - /srv/docker/wazuh/dashboard/custom:/usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom
    networks:
      - default
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.wazuh.rule=Host(`wazuh.ov.ffmuc.net`)
      - traefik.http.routers.wazuh.entrypoints=https
      - traefik.http.routers.wazuh.middlewares=noc-auth@file
      - traefik.http.routers.wazuh.tls=true
      - traefik.http.routers.wazuh.tls.certresolver=http
      - traefik.http.services.wazuh.loadbalancer.server.port=5601
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/5601"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 3m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    pids_limit: 1024
    logging: *logging
    depends_on:
      - wazuh.indexer
      - wazuh.manager

  # One-off tasks (docker compose --profile <name> run --rm <service>), not started by deploy.
  # Writes the internal users file with bcrypt hashes of the two secrets; run after a password change, then
  # securityadmin (README).
  init-users:
    profiles: [init]
    image: wazuh/wazuh-indexer:4.14.10@sha256:1d2aeadb9de88c6d17ce12030606425deca5a210cdf5c87008843da38eb629ea
    entrypoint: ["bash", "/init-users.sh"]
    user: "1000:1000"
    network_mode: none
    environment:
      ADMIN_PW: ${WAZUH_INDEXER_PASSWORD:?}
      DASHBOARD_PW: ${WAZUH_DASHBOARD_PASSWORD:?}
    volumes:
      - ./config/init-users.sh:/init-users.sh:ro
      - /srv/docker/wazuh:/out
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # 90 day retention for alert, monitoring and statistics indices (README, step "Retention").
  ism:
    profiles: [init]
    image: wazuh/wazuh-indexer:4.14.10@sha256:1d2aeadb9de88c6d17ce12030606425deca5a210cdf5c87008843da38eb629ea
    entrypoint: ["bash", "/ism.sh"]
    user: "1000:1000"
    environment:
      ADMIN_PW: ${WAZUH_INDEXER_PASSWORD:?}
    volumes:
      - ./config/ism.sh:/ism.sh:ro
      - ./config/ism-wazuh-retention.json:/policy.json:ro
      - /srv/docker/wazuh/certs/root-ca.pem:/usr/share/wazuh-indexer/config/certs/root-ca.pem:ro
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # Internal certificates (CA, node certificates, admin certificate), once; keys stay in /srv/docker/wazuh/certs.
  generator:
    profiles: [certs]
    image: wazuh/wazuh-certs-generator:0.0.5@sha256:1be9f9abfb6a37ac7bd3d6d707e1b43589c2b81b23c01a46992e93832795abf9
    hostname: wazuh-certs-generator
    environment:
      CERT_TOOL_VERSION: "4.14"
    volumes:
      - /srv/docker/wazuh/certs:/certificates
      - ./certs.yml:/config/certs.yml:ro

networks:
  proxy:
    external: true
