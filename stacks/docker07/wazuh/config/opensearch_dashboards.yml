server.host: 0.0.0.0
server.port: 5601
# TLS ends at Traefik (wazuh.ov.ffmuc.net), the hop over the proxy network is plain HTTP
server.ssl.enabled: false
opensearch.hosts: https://wazuh.indexer:9200
opensearch.ssl.verificationMode: certificate
opensearch.ssl.certificateAuthorities: ["/usr/share/wazuh-dashboard/certs/root-ca.pem"]
opensearch.requestHeadersWhitelist: ["securitytenant", "Authorization"]
opensearch_security.multitenancy.enabled: false
opensearch_security.readonly_mode.roles: ["kibana_read_only"]
uiSettings.overrides.defaultRoute: /app/wz-home
opensearch_security.cookie.ttl: 900000
opensearch_security.session.ttl: 900000
opensearch_security.session.keepalive: true
# basic auth stays as break-glass (admin); the client secret is in the keystore (entrypoint-scripts/dashboard.sh)
opensearch_security.auth.type: ["basicauth", "openid"]
opensearch_security.auth.multiple_auth_enabled: true
opensearch_security.openid.connect_url: https://keycloak.ffmuc.net/realms/noc/.well-known/openid-configuration
opensearch_security.openid.client_id: wazuh
opensearch_security.openid.base_redirect_url: https://wazuh.ov.ffmuc.net
opensearch_security.openid.scope: openid profile email
opensearch_security.openid.header: Authorization
opensearch_security.cookie.secure: true
