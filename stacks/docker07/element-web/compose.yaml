services:
  element-web:
    image: vectorim/element-web:v1.12.36@sha256:8812792403c7b9f94c0cd433bd2eb8dd9f1eb8a7908261aece71c1d5e2540561
    restart: unless-stopped
    environment:
      ELEMENT_WEB_PORT: "8080"
    volumes:
      # config.json from this directory of the checkout, not from /srv
      - ./config.json:/app/config.json:ro
    ports:
      - "10.8.0.16:8088:8080"
    read_only: true
    # the image runs as nginx (101) and renders its nginx config at start
    tmpfs:
      - /tmp:uid=101,gid=101
      - /etc/nginx/conf.d:uid=101,gid=101
      - /var/cache/nginx:uid=101,gid=101
      - /var/run:uid=101,gid=101
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 1
