---
# ADMIN_TOKEN and SSO_CLIENT_SECRET come from Komodo; /srv/docker/vaultwarden/data is owned by 1000:1000.
services:
  vaultwarden:
    image: vaultwarden/server:1.37.5@sha256:4fe17f415f90087377d37c755e0ea3cf189dcc6794e49cdd2a9adbb4937d9e1f
    container_name: vaultwarden
    user: "1000:1000"
    restart: unless-stopped
    environment:
      DOMAIN: "https://vault.ffmuc.net"
      ROCKET_PORT: "8080"
      SIGNUPS_ALLOWED: false
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      SSO_ENABLED: true
      SSO_ONLY: false
      SSO_AUTHORITY: "https://keycloak.ffmuc.net/realms/ffmuc"
      SSO_CLIENT_ID: "vault"
      SSO_CLIENT_SECRET: ${SSO_CLIENT_SECRET}
    volumes:
      - /srv/docker/vaultwarden/data:/data
    ports:
      - 11001:8080
    read_only: true
    tmpfs:
      - /tmp:uid=1000,gid=1000
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
