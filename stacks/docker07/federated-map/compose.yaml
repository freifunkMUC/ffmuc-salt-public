---
services:
  map:
    image: ghcr.io/freifunkmuc/freifunk-map-modern:latest
    command: ["/config.federation.json"]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    tmpfs:
      - /tmp
    volumes:
      # Caches only, rebuilt by the next crawl.
      - data:/data
    ports:
      - "0.0.0.0:8097:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  data:
