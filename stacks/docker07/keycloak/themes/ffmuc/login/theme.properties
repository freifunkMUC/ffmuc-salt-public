# Shared FFMUC login theme: CSS, logo, footer and legal links on top of keycloak.v2 (other templates come from there).
# Not set on a realm itself; the realms use the children ffmuc-member, ffmuc-chat and ffmuc-internal (noc).
parent=keycloak.v2
import=common/keycloak
# bump ?v= on every CSS change (browsers cache /resources for 30 days)
styles=css/styles.css?v=1 css/ffmuc.css?v=1
darkMode=false
locales=en,de
