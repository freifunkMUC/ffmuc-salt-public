# FFMUC login theme for internal tools (realm noc). Only adds CSS, a footer and messages on top of keycloak.v2,
# so Keycloak updates keep working; templates other than footer.ftl come from the parent.
parent=keycloak.v2
import=common/keycloak
styles=css/styles.css css/ffmuc.css
darkMode=false
locales=en,de
