---
# The database and admin passwords come from Komodo. The other settings are in
# env/keycloak.env.
volumes:
  postgres_data:
    driver: local

services:
  postgres:
    image: postgres:16.15-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: always
    volumes:
      - /srv/docker/keycloak/data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${DB_PASSWORD}
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.2@sha256:831330513f55695572286e521f94fcd3c7e285250ed5b848090265a33192f669
    restart: unless-stopped
    entrypoint: ["/opt/keycloak/bin/kc.sh", "start", "--proxy-headers", "xforwarded"]
    env_file:
      - env/keycloak.env
    environment:
      KC_DB_PASSWORD: ${DB_PASSWORD}
      KEYCLOAK_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      KC_FEATURES: authorization,token-exchange,docker,impersonation,scripts,web-authn,client-policies,parameterized-scopes
    ports:
      - 8081:8080
    depends_on:
      - postgres
