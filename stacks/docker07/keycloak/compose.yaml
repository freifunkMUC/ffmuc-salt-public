---
# The database and admin passwords come from Komodo. The other settings are in
# env/keycloak.env.
volumes:
  postgres_data:
    driver: local

services:
  postgres:
    image: postgres:18.6-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
    restart: always
    volumes:
      - /srv/docker/keycloak/data18:/var/lib/postgresql
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2@sha256:723b1d6e254c0fc96d5cffec860c7e0744d6a3277822b865bb538cf891575e41
    restart: unless-stopped
    entrypoint: ["/opt/keycloak/bin/kc.sh", "start", "--proxy-headers", "xforwarded"]
    volumes:
      # login theme for realm noc; Keycloak caches themes, so a theme change needs a Core restart (redeploy)
      - ./themes/ffmuc-internal:/opt/keycloak/themes/ffmuc-internal:ro
    env_file:
      - env/keycloak.env
    environment:
      KC_DB_PASSWORD: ${DB_PASSWORD}
      KEYCLOAK_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      KC_FEATURES: authorization,token-exchange,docker,impersonation,scripts,web-authn,client-policies,parameterized-scopes
    ports:
      - 8081:8080
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /realms/master HTTP/1.0\\r\\n\\r\\n\" >&3 && head -n1 <&3 | grep -q \" 200 \""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 2m
