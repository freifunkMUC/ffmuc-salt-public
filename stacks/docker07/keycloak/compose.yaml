---
# The database and admin passwords come from Komodo. The other settings are in
# env/keycloak.env.
volumes:
  postgres_data:
    driver: local

services:
  postgres:
    image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    restart: always
    volumes:
      - /srv/docker/keycloak/data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${DB_PASSWORD}
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1@sha256:3f3c5f8e03c614774b4bd9173b88391fefa4153bfc010d8012d59ad825377332
    restart: unless-stopped
    entrypoint: ["/opt/keycloak/bin/kc.sh", "start", "--proxy-headers", "xforwarded"]
    volumes:
      # login theme for realm noc; Keycloak caches themes, so a theme change needs a Core restart (redeploy)
      - ./themes/ffmuc-internal:/opt/keycloak/themes/ffmuc-internal:ro
    env_file:
      - env/keycloak.env
    environment:
      KC_DB_PASSWORD: ${DB_PASSWORD}
      KEYCLOAK_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      KC_FEATURES: authorization,token-exchange,docker,impersonation,scripts,web-authn,client-policies,parameterized-scopes
    ports:
      - 8081:8080
    depends_on:
      - postgres
