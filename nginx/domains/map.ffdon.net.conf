# Donau-Ries map: meshviewer build and config.json are rsynced by the meshviewer CI (user deploy-map,
# config-ffdon.json); the ffdon data comes from yanic on gw04.
upstream map_ffdon_data_upstream {
   server gw04.ext.ffmuc.net:443;
}

proxy_cache_path /var/cache/nginx-map-ffdon levels=1:2 keys_zone=map_ffdon_cache:10m inactive=120m use_temp_path=off;

server {
   listen {{ sslListen }} ssl;
   listen {{ sslListen6 }} ssl;

   ssl_certificate     /etc/letsencrypt/live/muenchen.freifunk.net/fullchain.pem;
   ssl_certificate_key /etc/letsencrypt/live/muenchen.freifunk.net/privkey.pem;

   server_name map.ffdon.net;

   root /srv/www/map.ffdon.net;

   location /data/meshviewer.json {
      proxy_pass https://map_ffdon_data_upstream/ffdon/meshviewer.json;
      proxy_cache map_ffdon_cache;
      proxy_cache_valid 200 302 1m;
      proxy_cache_revalidate  on;
   }

   access_log /var/log/nginx/{{ domain }}_access.log json_normal;
   error_log  /var/log/nginx/{{ domain }}_error.log;
}
