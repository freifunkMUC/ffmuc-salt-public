map $http_user_agent $autoupdater {
    "Gluon Autoupdater (using libuclient)" 1;
    default                                0;
}

map $http_x_firmware_version $firmwareVersion {
    "~^v(\d+)\.(\d+)\.(\d+)(-next|-main)?" $1.$2.$3$4;
    # old next versions v2020.3.4.1-next1 until v2020.3.5.0-next1
    "~^v2020\.3\..*-next"    "next-v2021";
    # Old autoupdaters do not send the X-Firmware-Version header
    default                  "unknown";
}

# When behind HAProxy, Nginx may see the connection as HTTPS even if the client used HTTP.
# Prefer the original scheme from X-Forwarded-Proto for redirects.
map $http_x_forwarded_proto $redirect_scheme {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Gluon base release a node runs on; keep each version pattern only here.
map $firmwareVersion $gluonBase {
    # OpenWrt 19.07 (Both Gluon v2019.1.x and v2020.1.x)
    #  Note: we do not have an upgrade path from pre-v2019 firmware
    "unknown"                           v2019_1;
    "~^2020\.3\.[2-5]"                  v2019_1;

    # OpenWrt 21.02
    "~^2021\.\d+\."                     v2021_1;
    "~^2022\.[1-5]\."                   v2021_1;
    "~^2022\.5\.[0-7]"                  v2021_1;
    "next-v2021"                        v2021_1;
    "~^2021\.(8|10|11)\.\d+-next"       v2021_1;
    "~^2022.2.1-next"                   v2021_1;

    # OpenWrt 22.03
    "~^2022\.10\."                      v2022_1;
    "~^2023\.[1-5]\."                   v2022_1;
    "~^2022\.(5|9|10)\.\d+-next$"       v2022_1;

    # OpenWRT 22.03 (still)
    "~^2023\.(8|11)\."                  v2023_1;
    "~^2024\.\d+\.\d+$"                 v2023_1;

    # OpenWrt 23.05
    "~^2023\.12\.2-next$"               v2023_2;
    "~^2024\.\d+\.\d+-next$"            v2023_2;
    "~^2025\.\d+\.\d+$"                 v2023_2;

    # OpenWrt 24.10
    "~^2025\.\d+\.\d+-main$"            v2025_1;
    "~^2026\.\d+\.\d+$"                 v2025_1;

    # OpenWrt 24.10 (still)
    "~^2026\.\d+\.\d+-main$"            main;

    # OpenWrt 25+
    "~^2025\.\d+\.\d+-next$"            next;
    "~^2026\.\d+\.\d+-next$"            next;

    # Else keep requested branch folder
    default              "keep";
}

map $gluonBase $targetDirectory {
    v2019_1  $gluon_v2019_1_x;
    v2021_1  $gluon_v2021_1_x;
    v2022_1  $gluon_v2022_1_x;
    v2023_1  $gluon_v2023_1_x;
    v2023_2  $gluon_v2023_2_x;
    v2025_1  $gluon_v2025_1_x;
    main     $gluon_main;
    next     $gluon_next;
    default  "keep";
}

# ER-X on a Gluon v2023.x base cannot sysupgrade to v2025.1 (new flash layout, compat 2.0).
# Remove once a migration path exists.
map $gluonBase $erxBlocked {
    v2023_1  1;
    v2023_2  1;
    default  0;
}

server {
    listen {{ sslListen }} ssl default_server;
    listen {{ sslListen6 }} ssl default_server;

    ssl_certificate     /etc/letsencrypt/live/ffmuc.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ffmuc.net/privkey.pem;

    server_name firmware.ffmuc.net firmware.in.ffmuc.net "";

    client_max_body_size 2048M;

    root /srv/www/firmware.ffmuc.net;
    autoindex on;
    location = / {
    }

    # temporary location to test the new firmware redirect feature
    location ~ ^/(?<branch>stable|testing|experimental)/(?<rest>.*)$ {
        # for accessing it e.g. via ffmuc.net/firmware
        add_header Access-Control-Allow-Origin "*";

        if ($autoupdater = "0") {
            break;
        }

        # Add Gluon releases here that allow an upgrade path to the latest version
        # https://github.com/freifunk-gluon/gluon/wiki/Release-life-cycle#migration-paths-diagram
        set $gluon_v2019_1_x "gluon-v2021.1.x"; # we want routers to upgrade from v2019 to v2021 and only then attempt v2023
        set $gluon_v2021_1_x "gluon-v2023.1.x_v2021.1.x";
        set $gluon_v2022_1_x "gluon-v2023.1.x_v2021.1.x";
        set $gluon_v2023_1_x "gluon-v2025.1.x_v2023.1.x";
        set $gluon_v2023_2_x "gluon-v2025.1.x_v2023.1.x";
        set $gluon_v2025_1_x "gluon-v2025.1.x_v2023.1.x";
        set $gluon_main "gluon-main";
        set $gluon_next "gluon-next";

        if ($targetDirectory = "keep") {
            break;
        }

        return 302 $redirect_scheme://$host/$targetDirectory/$branch/$rest;
    }

    location ~ ^/gluon-v2025\.1\.x_v2023\.1\.x/[^/]+/sysupgrade/[^/]+-ubiquiti-edgerouter-x(-sfp)?-sysupgrade\.bin$ {
        if ($erxBlocked) {
            # Status only matters for log analysis; the autoupdater treats any non-2xx as a failed download.
            return 409;
        }
    }

    location ^~ /.well-known/acme-challenge/ {
    }

    location ^~  /.gluon-firmware-selector {
    }

    location /raw {
        index none;
        alias /srv/www/firmware.ffmuc.net;
    }

    # opkg mirror
    location ~^/openwrt/(?<file>.+)$ {
        return 302 $redirect_scheme://mirror.kumi.systems/openwrt/$file;
    }

    location ~ /\. {
        deny all;
    }

    # opkg mirror
    location ~^/openwrt/(?<file>.+)$ {
        return 302 $redirect_scheme://mirror.kumi.systems/openwrt/$file;
    }

    # lede mirror
    location ~^/lede/(?<file>.+)$ {
        return 302 $redirect_scheme://downloads.openwrt.org/releases/$file;
    }

    location /wpad.dat {
        access_log  off;
        error_log  off;
        default_type text/plain;
        return 200 'OK';
    }

    access_log /var/log/nginx/{{ domain }}_access.log json_normal;
    error_log  /var/log/nginx/{{ domain }}_error.log;
}
