###
# Managed by Salt
###
# Interim map of the Parker nodes. The meshviewer and the yanic data are on
# pgw01 (nginx :80, /map/ and /map/data/), reached over nebula.
# Remove this vhost when the Parker data is on map.ffmuc.net.
upstream map_parker_upstream {
   server pgw01.ov.ffmuc.net:80;
}

proxy_cache_path /var/cache/nginx-map-parker levels=1:2 keys_zone=map_parker_cache:10m inactive=120m use_temp_path=off;

server {
   listen {{ sslListen }} ssl;
   listen {{ sslListen6 }} ssl;

   ssl_certificate     /etc/letsencrypt/live/ffmuc.net/fullchain.pem;
   ssl_certificate_key /etc/letsencrypt/live/ffmuc.net/privkey.pem;

   server_name {{ domain }};

   proxy_cache map_parker_cache;
   proxy_cache_valid 200 302 1m;
   proxy_cache_revalidate on;

   # An older pgw config.json has an absolute http data path. Behind https the
   # browser blocks it, so change it to the relative path. No effect on the
   # relative path from salt.
   location = /config.json {
      proxy_pass http://map_parker_upstream/map/config.json;
      proxy_set_header Accept-Encoding "";
      sub_filter_types application/json;
      sub_filter_once  on;
      sub_filter       '"http://pgw01.ext.ffmuc.net/map/data/"' '"data/"';
   }

   location /data/ {
      proxy_pass http://map_parker_upstream/map/data/;
   }

   location / {
      proxy_pass http://map_parker_upstream/map/;
   }

   access_log /var/log/nginx/{{ domain }}_access.log json_normal;
   error_log  /var/log/nginx/{{ domain }}_error.log;
}
