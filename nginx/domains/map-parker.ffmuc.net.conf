# Parker map: meshviewer build and config.json are rsynced by the meshviewer CI (user deploy-map,
# config-parker.json), the same build as map.ffmuc.net. The data comes from the pgws (parker/nginx):
# /data/ is the merged data of all sites, /data/vie01/ is the VIE01 yanic data on pgw03.
upstream map_parker_data_upstream {
   server pgw01.ov.ffmuc.net:80;
   server pgw03.ov.ffmuc.net:80 backup;
}

upstream map_parker_vie01_upstream {
   server pgw03.ov.ffmuc.net:80;
}

proxy_cache_path /var/cache/nginx-map-parker levels=1:2 keys_zone=map_parker_cache:10m inactive=120m use_temp_path=off;

server {
   listen {{ sslListen }} ssl;
   listen {{ sslListen6 }} ssl;

   ssl_certificate     /etc/letsencrypt/live/ffmuc.net/fullchain.pem;
   ssl_certificate_key /etc/letsencrypt/live/ffmuc.net/privkey.pem;

   server_name map-parker.ffmuc.net;

   root /srv/www/map-parker.ffmuc.net;

   # merge-map-data.timer on the pgws writes the merged data every 30s
   location /data/vie01/ {
      proxy_pass http://map_parker_vie01_upstream/map/data/vie01/;
      proxy_cache map_parker_cache;
      proxy_cache_valid 200 302 30s;
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
   }

   location /data/ {
      proxy_pass http://map_parker_data_upstream/map/data/;
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_cache map_parker_cache;
      proxy_cache_valid 200 302 30s;
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
   }

   # Grafana API for the chart queries: the upstream and the cache of map.ffmuc.net
   # (map.ffmuc.net.conf), which is on the same webfrontends.
   location /grafana/ {
      proxy_pass         https://grafana_api_backend/;
      proxy_redirect     off;
      proxy_set_header   Host stats.ffmuc.net;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Host $server_name;
      proxy_http_version 1.1;
      proxy_set_header   Connection "";

      proxy_cache                   grafana_map_api;
      proxy_cache_methods           POST;
      proxy_cache_key               "$request_uri|$request_body";
      proxy_cache_valid             200 60s;
      proxy_cache_lock              on;
      proxy_cache_use_stale         error timeout updating http_500 http_502 http_503 http_504;
      proxy_cache_background_update on;
      proxy_ignore_headers          Cache-Control expires;
      add_header                    X-Cache-Status $upstream_cache_status;
   }

   access_log /var/log/nginx/{{ domain }}_access.log json_normal;
   error_log  /var/log/nginx/{{ domain }}_error.log;
}
