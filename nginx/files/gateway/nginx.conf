# Managed by Salt (nginx.gateway)
user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;

events {
	worker_connections 768;
}

http {
	sendfile on;
	tcp_nopush on;
	types_hash_max_size 2048;
	server_tokens off;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_prefer_server_ciphers on;

	access_log /var/log/nginx/access.log;
	set_real_ip_from 127.0.0.1;
	real_ip_header proxy_protocol;

	gzip on;

	include /etc/nginx/conf.d/*.conf;
	include /etc/nginx/sites-enabled/*;
}

# Gluon checkuplink sends "Host: [fe80::...%iface]", which nginx http rejects (400).
# Link-local clients get a fixed 200; all other clients go to the http servers on 127.0.0.1:8080.
stream {
	map $remote_addr $gw_port80_upstream {
		~^fe80: 127.0.0.1:8081;
		default 127.0.0.1:8080;
	}
	server {
		listen 80;
		listen [::]:80;
		proxy_pass $gw_port80_upstream;
		proxy_protocol on;
	}
	server {
		listen 127.0.0.1:8081 proxy_protocol;
		return "HTTP/1.1 200 OK\r\nContent-Type: text/plain\r\nContent-Length: 3\r\nConnection: close\r\n\r\nok\n";
	}
}
