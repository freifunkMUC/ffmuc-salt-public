#
# Mail queue state file of mail01 (check_ffmuc_mailqueue)
object CheckCommand "ffmuc_mailqueue" {
	import "plugin-check-command"

	command = [ FFHOPluginDir + "/check_ffmuc_mailqueue" ]

	arguments = {
		"-w" = "$mailqueue_warning$"
		"-c" = "$mailqueue_critical$"
		"--max-age" = "$mailqueue_max_age$"
		"--stale" = "$mailqueue_stale$"
	}

	vars.mailqueue_warning = 50
	vars.mailqueue_critical = 200
	vars.mailqueue_max_age = 3600
	vars.mailqueue_stale = 900
}
