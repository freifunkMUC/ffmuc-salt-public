#
# Mail service health state file of mail01 (check_ffmuc_mailhealth)
object CheckCommand "ffmuc_mailhealth" {
	import "plugin-check-command"

	command = [ FFHOPluginDir + "/check_ffmuc_mailhealth" ]

	arguments = {
		"--jails" = "$mailhealth_jails$"
		"--stale" = "$mailhealth_stale$"
		"--bounced-warning" = "$mailhealth_bounced_warning$"
		"--bounced-critical" = "$mailhealth_bounced_critical$"
		"--deferred-warning" = "$mailhealth_deferred_warning$"
		"--banned-warning" = "$mailhealth_banned_warning$"
	}

	vars.mailhealth_jails = "custom,dovecot,postfix,postfix-sasl"
	vars.mailhealth_stale = 900
	vars.mailhealth_bounced_warning = 10
	vars.mailhealth_bounced_critical = 30
	vars.mailhealth_deferred_warning = 20
	vars.mailhealth_banned_warning = 20
}
