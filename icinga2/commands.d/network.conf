#
# FFHO Check Commands for network related stuff (Salt Managed)
#

#
# Conntrack table size
object CheckCommand "conntrack_size" {
	import "plugin-check-command"

	command = [ "/usr/bin/sudo", FFHOPluginDir + "/check_conntrack_size" ]
}

#
# BGP sessions in bird 2 (CRITICAL when one is not Established)
object CheckCommand "bird_bgp_sessions" {
	import "plugin-check-command"

	command = [ FFHOPluginDir + "/check_bird_bgp_sessions" ]

	arguments = {
		"--ignore" = {
			value = "$bird_bgp_sessions_down_ok$"
			repeat_key = true
			description = "Protocol names (fnmatch patterns) which are OK to be down"
		}
	}
}

#
# WireGuard handshake age (CRITICAL when a peer had no handshake for too long)
object CheckCommand "wireguard_handshakes" {
	import "plugin-check-command"

	command = [ FFHOPluginDir + "/check_wireguard_handshakes" ]

	arguments = {
		"--interface" = {
			value = "$wireguard_interface$"
			description = "Only check interfaces matching this regex"
		}
		"--max-age" = {
			value = "$wireguard_max_age$"
			description = "Max. age of the latest handshake in seconds"
		}
		"--ignore" = {
			value = "$wireguard_down_ok$"
			repeat_key = true
			description = "Interfaces (fnmatch patterns) which are OK to be down"
		}
	}

	vars.wireguard_max_age = 600
}
