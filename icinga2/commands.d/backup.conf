#
# Age of the database dumps of the rustic state (backup.dump_commands)
object CheckCommand "ffmuc_dumps" {
	import "plugin-check-command"

	command = [ "/usr/bin/sudo", FFHOPluginDir + "/check_ffmuc_dumps" ]
}

# Last successful run of ffmuc-rustic-backup.service
object CheckCommand "ffmuc_rustic" {
	import "plugin-check-command"

	command = [ FFHOPluginDir + "/check_ffmuc_rustic" ]
}
