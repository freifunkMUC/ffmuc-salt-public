#
# FFHO Check Commands for gateways and the mesh daemons (Salt Managed)
#

object CheckCommand "systemd_units" {
	import "plugin-check-command"

	command = [ FFHOPluginDir + "/check_systemd_units" ]

	arguments = {
		"--unit" = {
			value = "$systemd_units_unit$"
			repeat_key = true
		}
		"--template" = "$systemd_units_template$"
		"--from-systemd" = {
			set_if = "$systemd_units_from_systemd$"
		}
		"--from-links" = "$systemd_units_from_links$"
	}
}

object CheckCommand "gateway_interfaces" {
	import "plugin-check-command"

	command = [ FFHOPluginDir + "/check_gateway_interfaces" ]
}
