#
# The API listener is used for distributed monitoring setups. (Salt managed)
#

object ApiListener "api" {
	ticket_salt = TicketSalt

	accept_commands = true
	accept_config = true
{%- if grains['id'].endswith('.meet.ffmuc.net') %}

	# the Jitsi hosts have no host firewall and connect to the master themselves: do not listen publicly
	bind_host = "127.0.0.1"
{%- endif %}
}
