#
# zones.conf (Salt managed)
#

object Endpoint "{{ grains.id }}"  {
       host = "{{ grains.id }}"
}

object Zone "{{ grains.id }}" {
       endpoints = [ "{{ grains.id }}" ]
       parent = "master"
}

object Endpoint "icinga-vie01.in.ffmuc.net" {
	{#- Jitsi hosts (only in nebula-meet): NetBox config context icinga2.master_address = nebula-meet address of icinga-vie01 #}
	host = "{{ salt['pillar.get']('netbox:config_context:icinga2:master_address', 'icinga-vie01.ov.ffmuc.net') if grains.id.endswith('.meet.ffmuc.net') else 'icinga-vie01.ov.ffmuc.net' }}"
	port = "5665"
}

object Zone "master" {
	endpoints = [ "icinga-vie01.in.ffmuc.net" ]
}

object Zone "global-templates" {
	global = true
}
