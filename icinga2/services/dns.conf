# DDR certificate "ffmuc-dns" (certs/ddr_cert.jinja): Let's Encrypt "shortlived" profile, valid
# for 6 days, certbot renews it about 3 days before expiry. Enable per host with the NetBox tag
# "ddr-cert" when the host serves the certificate. The check sees the SNI certificate only,
# it does not verify the IP addresses in the certificate.
apply Service "ddr-cert-" for (port => sni in {"853" = "dot.ffmuc.net", "443" = "doh.ffmuc.net"}) {
	import "generic-service"

	check_command = "ssl"
	vars.ssl_port = port
	vars.ssl_sni = sni
	vars.ssl_cert_valid_days_warn = 2
	vars.ssl_cert_valid_days_critical = 1

	assign where host.address && host.vars.role == "webserver-external" && "ddr-cert" in host.vars.tags
	ignore where host.vars.agentless
}
