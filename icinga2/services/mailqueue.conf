#
# Mail queue of mail01 (docker-mailserver), from the state file written by the
# `mailqueue` state. Can be merged into mail.conf later.
#
apply Service "mailqueue" {
	import "generic-service"

	check_command = "ffmuc_mailqueue"

	if (host.name != NodeName) {
		command_endpoint = host.name
	}

	check_interval = 5m
	retry_interval = 2m
	max_check_attempts = 3

	assign where host.name == "mail01.in.ffmuc.net"
	ignore where host.vars.agentless
}
