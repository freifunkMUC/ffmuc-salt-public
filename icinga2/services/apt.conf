apply Service "apt" {
  import "generic-service"

  check_command = "apt"
  if (host.name != NodeName) {
     command_endpoint = host.name
  }
  vars.apt_only_critical = true
  check_interval = 1h
  retry_interval = 6h
  max_check_attempts = 7
  assign where host.address && host.vars.os == "Linux"
  ignore where host.vars.agentless
}
