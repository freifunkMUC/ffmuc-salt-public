#
# Infrastructure services, checked from the master over the overlay.
#

# LDAPS of OpenLDAP (ldap.ov.ffmuc.net on docker04) with its certificate
apply Service "ldaps-636" {
	import "generic-service"

	check_command = "tcp"

	vars.tcp_address = "ldap.ov.ffmuc.net"
	vars.tcp_port = 636
	vars.tcp_ssl = true
	vars.tcp_certificate = "14,7"
	vars.tcp_timeout = 15

	check_interval = 5m
	retry_interval = 1m
	max_check_attempts = 5

	assign where host.name == "docker04.in.ffmuc.net"
}

# Salt master container on docker05: publisher and request server
apply Service "salt-master-" for (port in [ 4505, 4506 ]) {
	import "generic-service"

	check_command = "tcp"

	vars.tcp_address = host.name
	vars.tcp_port = port

	check_interval = 1m
	retry_interval = 30s
	max_check_attempts = 3

	assign where host.name == "docker05.in.ffmuc.net"
}
