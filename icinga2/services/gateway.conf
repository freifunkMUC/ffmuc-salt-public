#
# Gateway and mesh daemons (Salt managed)
#

apply Service "respondd" {
	import "generic-service"

	check_command = "systemd_units"

	if (host.name != NodeName) {
		command_endpoint = host.name
	}

	vars.systemd_units_template = "respondd@"
	vars.systemd_units_from_links = "br-"
	check_interval = 2m
	retry_interval = 1m
	max_check_attempts = 3

	assign where host.vars.os == "Linux" && host.vars.role == "nextgen-gateway"
	ignore where host.vars.agentless
}

# Instances come from pillar unified_respondd:instances (gw04 only); the config directory is root-only, so use what systemd loaded.
apply Service "unified-respondd" {
	import "generic-service"

	check_command = "systemd_units"

	if (host.name != NodeName) {
		command_endpoint = host.name
	}

	vars.systemd_units_template = "unified-respondd@"
	vars.systemd_units_from_systemd = true
	check_interval = 2m
	retry_interval = 1m
	max_check_attempts = 3

	assign where host.vars.os == "Linux" && host.vars.role == "nextgen-gateway"
	ignore where host.vars.agentless
}

apply Service "gateway-daemons" {
	import "generic-service"

	check_command = "systemd_units"

	if (host.name != NodeName) {
		command_endpoint = host.name
	}

	vars.systemd_units_unit = [ "wgkex.service", "radvd.service", "nebula.service" ]
	check_interval = 2m
	retry_interval = 1m
	max_check_attempts = 3

	assign where host.vars.os == "Linux" && host.vars.role == "nextgen-gateway"
	ignore where host.vars.agentless
}

apply Service "gateway-interfaces" {
	import "generic-service"

	check_command = "gateway_interfaces"

	if (host.name != NodeName) {
		command_endpoint = host.name
	}

	check_interval = 2m
	retry_interval = 1m
	max_check_attempts = 3

	assign where host.vars.os == "Linux" && host.vars.role == "nextgen-gateway"
	ignore where host.vars.agentless
}

apply Service "yanic" {
	import "generic-service"

	check_command = "systemd_units"

	if (host.name != NodeName) {
		command_endpoint = host.name
	}

	vars.systemd_units_unit = [ "yanic.service" ]
	check_interval = 2m
	retry_interval = 1m
	max_check_attempts = 3

	assign where host.vars.os == "Linux" && host.vars.tags && "yanic" in host.vars.tags
	ignore where host.vars.agentless
}

# yanic rewrites its state file every 30 s
apply Service "yanic-state" {
	import "generic-service"

	check_command = "file_age"

	if (host.name != NodeName) {
		command_endpoint = host.name
	}

	vars.file_age_path = "/srv/yanic/state.json"
	vars.file_age_warning_time = 180
	vars.file_age_critical_time = 600
	check_interval = 2m
	retry_interval = 1m
	max_check_attempts = 3

	assign where host.vars.os == "Linux" && host.vars.tags && "yanic" in host.vars.tags
	ignore where host.vars.agentless
}
