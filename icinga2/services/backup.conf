#
# Dumps written before each rustic backup (NetBox backup.dump_commands, rustic state).
# OK without dumps; WARNING after 26 h, CRITICAL after 50 h or when a dump is missing.
apply Service "ffmuc_dumps" {
	import "generic-service"

	check_command = "ffmuc_dumps"

	if (host.name != NodeName) {
		command_endpoint = host.name
	}

	check_interval = 1h
	retry_interval = 15m

	assign where host.vars.os == "Linux" && "backup" in host.vars.tags
	ignore where host.vars.agentless
}
