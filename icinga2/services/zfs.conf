#
# ZFS pools: WARNING from 80 %, CRITICAL from 90 % capacity or a pool not ONLINE.
apply Service "zpool" {
	import "generic-service"

	check_command = "ffmuc_zpool"

	if (host.name != NodeName) {
		command_endpoint = host.name
	}

	check_interval = 5m
	retry_interval = 2m

	assign where host.vars.os == "Linux" && "zfs" in host.vars.tags
	ignore where host.vars.agentless
}
