# Prosody: BOSH endpoint (web clients) and c2s port (Jicofo, JVBs)
apply Service "prosody-bosh" {
	import "generic-service"

	check_command = "http"

	if (host.name != NodeName) {
		command_endpoint = host.name
	}

	vars.http_address = "127.0.0.1"
	vars.http_port = 5280
	vars.http_uri = "/http-bind"

	check_interval = 1m
	retry_interval = 30s
	max_check_attempts = 5

	assign where match("jicofo*.meet.ffmuc.net", host.name)
	ignore where host.vars.agentless
}

apply Service "prosody-c2s" {
	import "generic-service"

	check_command = "tcp"

	if (host.name != NodeName) {
		command_endpoint = host.name
