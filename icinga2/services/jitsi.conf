#
# Jitsi (meet.ffmuc.net) checks
#
# The agent checks need an Icinga agent on the Jitsi hosts. Until a host has the
# NetBox tag icinga2_client instead of icinga2_agentless they stay inactive
# (ignore where host.vars.agentless, see README).
#

# Public entry point, checked from the master through DNS, haproxy and nginx
apply Service "meet-https" {
	import "generic-service"

	check_command = "http"

	vars.http_address = "meet.ffmuc.net"
	vars.http_vhost = "meet.ffmuc.net"
	vars.http_ssl = true
	vars.http_sni = true
	vars.http_uri = "/"
	vars.http_certificate = "14,7"
	vars.http_timeout = 15

	check_interval = 1m
	retry_interval = 30s
	max_check_attempts = 5

	assign where host.name == NodeName
}

# SIP trunk of the dial-in number (Asterisk on call01)
apply Service "sip-registration" {
	import "generic-service"

	check_command = "asterisk_registration"

	if (host.name != NodeName) {
		command_endpoint = host.name
	}

	check_interval = 1m
	retry_interval = 1m
	max_check_attempts = 5

	assign where match("call*.meet.ffmuc.net", host.name)
	ignore where host.vars.agentless
}

apply Service "asterisk" {
	import "generic-service"

	check_command = "procs"

	if (host.name != NodeName) {
		command_endpoint = host.name
	}

	vars.procs_critical = "1:"
	vars.procs_warning = "1:"
	vars.procs_command = "asterisk"

	check_interval = 1m
	retry_interval = 30s
	max_check_attempts = 3

	assign where match("call*.meet.ffmuc.net", host.name)
	ignore where host.vars.agentless
}

# Jigasi answers 500 "GW not ready" on /about/health while it is not connected
apply Service "jigasi-health" {
	import "generic-service"

	check_command = "http"

	if (host.name != NodeName) {
		command_endpoint = host.name
	}

	vars.http_address = "127.0.0.1"
	vars.http_port = 8788
	vars.http_uri = "/about/health"

	check_interval = 1m
	retry_interval = 30s
	max_check_attempts = 5

	assign where match("call*.meet.ffmuc.net", host.name)
	ignore where host.vars.agentless
}

