#
# Public vhosts and overlay web UIs, checked from the master through DNS,
# haproxy and nginx like meet-https (services/jitsi.conf). "https-<name>" checks
# the answer, "cert-<name>" the certificate (14/7 days); check_http -C stops
# after the certificate, so the two cannot be one service.
#
const FfmucWebChecks = {
	"keycloak" = { host = "keycloak.ffmuc.net", uri = "/realms/master/.well-known/openid-configuration", string = "\"issuer\"" },
	"chat"     = { host = "chat.ffmuc.net", uri = "/api/v4/system/ping", string = "\"OK\"" },
	"cloud"    = { host = "cloud.ffmuc.net", uri = "/status.php", string = "\"installed\"" },
	"social"   = { host = "social.ffmuc.net", uri = "/health" },
	"tickets"  = { host = "tickets.ffmuc.net", uri = "/" },
	"vault"    = { host = "vault.ffmuc.net", uri = "/alive" },
	"map"      = { host = "map.ffmuc.net", uri = "/data/meshviewer.json", string = "\"nodes\"" },
	"firmware" = { host = "firmware.ffmuc.net", uri = "/" },
	"apt"      = { host = "apt.ffmuc.net", uri = "/" },
	"stats"    = { host = "stats.ffmuc.net", uri = "/api/health", string = "\"database\"" },
	"influx"   = { host = "influx.ffmuc.net", uri = "/ping", expect = "204" },
}

apply Service "https-" + name for (name => cfg in FfmucWebChecks) {
	import "generic-service"

	check_command = "http"

	vars.http_address = cfg.host
	vars.http_vhost = cfg.host
	vars.http_ssl = true
	vars.http_sni = true
	vars.http_uri = cfg.uri
	if (cfg.contains("string")) {
		vars.http_string = cfg.string
	}
	if (cfg.contains("expect")) {
		vars.http_expect = cfg.expect
	}
	vars.http_timeout = 15

	check_interval = 5m
	retry_interval = 1m
	max_check_attempts = 5

	assign where host.name == NodeName
}

apply Service "cert-" + name for (name => cfg in FfmucWebChecks) {
	import "generic-service"

	check_command = "http"

	vars.http_address = cfg.host
	vars.http_vhost = cfg.host
	vars.http_ssl = true
	vars.http_sni = true
	vars.http_certificate = "14,7"
	vars.http_timeout = 15

	check_interval = 1h
	retry_interval = 10m
	max_check_attempts = 3

	assign where host.name == NodeName
}

# NetBox and Komodo UIs on the overlay names (Traefik); /api/ answers 403
# without a token, which is the expected state of a running NetBox.
apply Service "netbox-https" {
	import "generic-service"

	check_command = "http"

	vars.http_address = "nb.ov.ffmuc.net"
	vars.http_vhost = "nb.ov.ffmuc.net"
	vars.http_ssl = true
	vars.http_sni = true
	vars.http_uri = "/api/"
	vars.http_expect = "403"
	vars.http_timeout = 15

	check_interval = 5m
	retry_interval = 1m
	max_check_attempts = 5

	assign where host.name == "docker04.in.ffmuc.net"
}

