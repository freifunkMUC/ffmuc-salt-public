#
# Rows missing from the Zammad search index (database count minus index count, rows changed in the last 15 minutes ignored).
# WARNING from 5, CRITICAL from 20 missing rows of any of tickets, users, organizations.
apply Service "zammad_index" {
	import "generic-service"

	check_command = "zammad_index"

	if (host.name != NodeName) {
		command_endpoint = host.name
	}

	check_interval = 30m
	retry_interval = 10m

	assign where host.name == "docker05.in.ffmuc.net"
}
