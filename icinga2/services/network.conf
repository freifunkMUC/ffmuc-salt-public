#
# Network related checks (FFMUC-built)
#
#
# Metfilter connection tracking table size
apply Service "conntrack_size" {
	import "generic-service"

	check_command = "conntrack_size"

	if (host.name != NodeName) {
		command_endpoint = host.name
	}

	assign where host.address && host.vars.os == "Linux"
	ignore where host.vars.agentless
}

# bird process
apply Service "bird" {
	import "generic-service"

	check_command = "procs"

	if (host.name != NodeName) {
		command_endpoint = host.name
	}

	vars.procs_command = "bird"
	vars.procs_critical = "1:"
	vars.procs_warning = ":1"
	check_interval = 5m
	max_check_attempts = 3
	retry_interval = 3m

	assign where host.vars.os == "Linux" && (host.vars.role in ["webserver-external", "nextgen-gateway", "freifunk-transit"])
	ignore where host.vars.agentless
}

# BGP sessions in bird: CRITICAL once a session is not Established for about
# 10 minutes (soft state first, hard after max_check_attempts * retry_interval).
# Known-dead sessions: icinga2/known_down.yaml (host var bgp_sessions_down_ok).
apply Service "bgp_sessions" {
	import "generic-service"

	check_command = "bird_bgp_sessions"

	if (host.name != NodeName) {
		command_endpoint = host.name
	}

	vars.bird_bgp_sessions_down_ok = host.vars.bgp_sessions_down_ok
	check_interval = 2m
	retry_interval = 2m
	max_check_attempts = 5

	assign where host.vars.os == "Linux" && (host.vars.role in ["webserver-external", "nextgen-gateway", "freifunk-transit"])
	ignore where host.vars.agentless
}

# WireGuard tunnels to partner communities: CRITICAL when a peer had no
# handshake for 10 minutes. Not on the gateways: their wg-<domain> peers are
# Freifunk nodes managed by wgkex, which come and go.
# Known-dead tunnels: icinga2/known_down.yaml (host var wireguard_down_ok).
apply Service "wireguard_handshakes" {
	import "generic-service"

	check_command = "wireguard_handshakes"

	if (host.name != NodeName) {
		command_endpoint = host.name
	}

	vars.wireguard_down_ok = host.vars.wireguard_down_ok
	check_interval = 2m
	retry_interval = 2m
	max_check_attempts = 3

	assign where host.vars.os == "Linux" && host.vars.role == "freifunk-transit"
	ignore where host.vars.agentless
}

# Are we able to reach the internet?
apply Service "ping4-google" {
	import "generic-service"

	check_command = "ping4"
	vars.ping_address = "8.8.8.8"
	if (host.name != NodeName) {
		command_endpoint = host.name
	}

	assign where host.address
	ignore where host.vars.agentless
}

apply Service "ping6-google" {
	import "generic-service"

	check_command = "ping6"
	vars.ping_address = "2001:4860:4860::8888"
	if (host.name != NodeName) {
		command_endpoint = host.name
	}

	assign where host.vars.external_address_6
	ignore where host.vars.agentless
}
