#
# Mail service health of mail01 (docker-mailserver), from the state file
# written by the `mailqueue` state.
#
apply Service "mailhealth" {
	import "generic-service"

	check_command = "ffmuc_mailhealth"

	if (host.name != NodeName) {
		command_endpoint = host.name
	}

	check_interval = 5m
	retry_interval = 2m
	max_check_attempts = 3

	assign where host.name == "mail01.in.ffmuc.net"
	ignore where host.vars.agentless
}
