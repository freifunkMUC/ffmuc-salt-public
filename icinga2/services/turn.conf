#
# TURN servers (coturn for Jitsi, static hosts with role "turn"), checked from
# the master: the plain listener on 3478/tcp and TURN over TLS on 443, the only
# port Jitsi announces, including the certificate's expiry.
#

apply Service "turn-3478" {
	import "generic-service"

	check_command = "tcp"
	vars.tcp_port = 3478

	assign where host.vars.role == "turn"
}

apply Service "turn-tls-443" {
	import "generic-service"

	check_command = "ssl"
	vars.ssl_port = 443
	vars.ssl_sni = host.name
	vars.ssl_cert_valid_days_warn = 21
	vars.ssl_cert_valid_days_critical = 7

	assign where host.vars.role == "turn"
}
