#
# Mail related stuff (Salt managed)
#

#
# mailq
apply Service "mailq" {
        import "generic-service"

	check_command = "sudo_mailq"

	if (host.name != NodeName) {
		command_endpoint = host.name
	}

	vars.mailq_servertype = "postfix"
	vars.mailq_warning = 5
	vars.mailq_critical = 10
#	vars.mailq_sudo = true

	assign where host.address && host.vars.os == "Dummy"
	ignore where host.vars.agentless
}

#
# mail01 (docker-mailserver), checked from the master. check_smtp cannot read
# the certificate behind STARTTLS (-D implies SSL), so the days are checked on
# the implicit-TLS ports 465 and 993, which use the same certificate.
#
apply Service "smtp-25" {
	import "generic-service"

	check_command = "smtp"

	vars.smtp_address = host.name
	vars.smtp_port = 25
	vars.smtp_starttls = true
	vars.smtp_timeout = 20

	check_interval = 5m
	retry_interval = 1m
	max_check_attempts = 5

	assign where host.name == "mail01.in.ffmuc.net"
}

apply Service "smtp-587" {
	import "generic-service"

	check_command = "smtp"

	vars.smtp_address = host.name
	vars.smtp_port = 587
	vars.smtp_starttls = true
	vars.smtp_timeout = 20

	check_interval = 5m
	retry_interval = 1m
	max_check_attempts = 5

	assign where host.name == "mail01.in.ffmuc.net"
}

apply Service "smtps-465" {
	import "generic-service"

	check_command = "smtp"

	vars.smtp_address = host.name
	vars.smtp_port = 465
	vars.smtp_certificate_age = "14,7"
	vars.smtp_timeout = 20

	check_interval = 5m
	retry_interval = 1m
	max_check_attempts = 5

	assign where host.name == "mail01.in.ffmuc.net"
}

apply Service "imaps-993" {
	import "generic-service"

	check_command = "imap"

	vars.imap_address = host.name
	vars.imap_port = 993
	vars.imap_ssl = true
	vars.imap_certificate_age = "14,7"
	vars.imap_timeout = 20

	check_interval = 5m
	retry_interval = 1m
	max_check_attempts = 5

	assign where host.name == "mail01.in.ffmuc.net"
}
