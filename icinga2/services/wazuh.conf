# Wazuh manager container and daemons (CRITICAL), agents not active (WARNING from 1, CRITICAL from 5).
apply Service "wazuh" {
	import "generic-service"

	check_command = "wazuh"

	if (host.name != NodeName) {
		command_endpoint = host.name
	}

	check_interval = 5m
	retry_interval = 2m

	assign where host.name == "docker07.in.ffmuc.net"
}
