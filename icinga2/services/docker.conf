#
# Base services of ffmuc
#


# Check if docker is running
apply Service "dockerd" {
	import "generic-service"

	check_command = "procs"

	if (host.name != NodeName) {
		command_endpoint = host.name
	}

	vars.procs_critical = "1"
	vars.procs_warning = "1"
	vars.procs_command = "dockerd"
	check_interval = 1m
	max_check_attempts = 3
	retry_interval = 30s

	assign where (host.vars.role == "docker" || "docker" in host.vars.tags)
	ignore where host.vars.agentless
}

# Weekly Trivy scan: WARNING on new fixable CRITICAL (image, CVE) pairs in the last scan, more than half of the scans failing or a report older than 9 days.
# OK on hosts without the NetBox config context trivy.enabled.
apply Service "ffmuc_trivy" {
	import "generic-service"

	check_command = "ffmuc_trivy"

	if (host.name != NodeName) {
		command_endpoint = host.name
	}

	check_interval = 6h
	retry_interval = 1h

	assign where host.vars.os == "Linux" && (host.vars.role == "docker" || "docker" in host.vars.tags)
	ignore where host.vars.agentless
}
