{%- set threads = [grains.num_cpus, 8] | min %}
{#- Caches were full at the old limits; size them by available RAM (~1.2 KB per entry incl. overhead) #}
{%- if grains.mem_total >= 32768 %}
{%- set recordcache_entries = 8000000 %}
{%- set packetcache_entries = 2000000 %}
{%- elif grains.mem_total >= 8192 %}
{%- set recordcache_entries = 3000000 %}
{%- set packetcache_entries = 1000000 %}
{%- else %}
{%- set recordcache_entries = 2000000 %}
{%- set packetcache_entries = 500000 %}
{%- endif %}
dnssec:
  validation: validate
  negative_trustanchors:
  - name: web.de
    reason: They fucked up their shit
  - name: gmx.net
    reason: They fucked up their shit
  - name: tudos.de
    reason: They fucked up
  - name: gem2go.page
    reason: They fucked up
  - name: gemeinde.laas.bz.it
    reason: They fucked up
incoming:
  allow_from:
  {%- if 'dnsdist' in salt['pillar.get']('netbox:tag_list', []) %}
  - 127.0.0.1/32
  - ::1/128
  - 10.8.0.0/23
  - 10.80.248.32/27
  - 10.80.248.64/27
{%- else %}
  - 127.0.0.1/32
  - ::1/128
  - 10.80.0.0/16
  - 10.8.0.0/23
  - 2001:678:e68::/48
  - 2001:678:ed0::/48
{%- endif %}
  distributor_threads: 2
  edns_padding_from:
  - 0.0.0.0/0
  listen:
  - 0.0.0.0
  - '::'
  pdns_distributes_queries: true
  {%- if 'dnsdist' in salt['pillar.get']('netbox:tag_list', []) %}
  port: 1653
  {%- endif %}
  reuseport: true
outgoing:
  source_address:
  - 0.0.0.0
  - '::'
packetcache:
  max_entries: {{ packetcache_entries }}
recordcache:
  max_entries: {{ recordcache_entries }}
  # cache DNSSEC-bogus results only briefly (default 3600s): a transient failure such as a DNSKEY fetch timeout
  # would otherwise keep answering SERVFAIL for an hour on the one recursor dnsdist hashes the name to
  max_cache_bogus_ttl: 60
  # refresh popular records before they expire instead of on the next (slow) cache miss
  refresh_on_ttl_perc: 10
  # serve expired records (up to 120 x 30s) when the authoritative servers can't be reached
  serve_stale_extensions: 120
  zonetocaches:
    - zone: .
      method: url
      sources: ['https://www.internic.net/domain/root.zone']
recursor:
  server_id: dot.ffmuc.net
  threads: {{ threads }}
  tcp_threads: {{ threads }}
  version_string: dot.ffmuc.net
webservice:
  address: 127.0.0.1
  allow_from:
  - 127.0.0.1
  - ::1
  webserver: true
