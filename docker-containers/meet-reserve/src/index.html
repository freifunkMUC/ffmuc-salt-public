<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark">
<title>FFMUC Meet</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
  :root {
    --bg: #16181d; --card: rgba(34, 40, 49, .72); --line: rgba(255,255,255,.08);
    --text: #eef0f3; --muted: #9ba3ae; --accent: #dc0067; --accent2: #ff4d94; --sun: #f5c400;
    --ok: #2fd18a; --warn: #ffb547; --radius: 18px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font: 16px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text); background: var(--bg); overflow-x: hidden;
    display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem 1rem;
  }
  .blob { position: fixed; border-radius: 50%; filter: blur(100px); opacity: .32; z-index: -1; animation: drift 22s ease-in-out infinite alternate; }
  .b1 { width: 520px; height: 520px; background: #dc0067; top: -160px; left: -140px; }
  .b2 { width: 460px; height: 460px; background: #8a1450; bottom: -160px; right: -120px; animation-delay: -8s; }
  .b3 { width: 300px; height: 300px; background: #f5c400; top: 40%; left: 60%; opacity: .14; animation-delay: -14s; }
  @keyframes drift { to { transform: translate(60px, 40px) scale(1.15); } }

  main { width: 100%; max-width: 640px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1.4rem; flex-wrap: wrap; }
  #langs { display: flex; gap: 2px; padding: 3px; border-radius: 999px; background: rgba(0,0,0,.25); border: 1px solid var(--line); }
  #langs button { border: 0; background: none; color: var(--muted); font: inherit; font-size: .75rem; font-weight: 600; letter-spacing: .04em; padding: .3rem .6rem; border-radius: 999px; cursor: pointer; }
  #langs button:hover { color: var(--text); }
  #langs button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .brand { display: flex; align-items: center; gap: .6rem; color: var(--muted); font-weight: 600; letter-spacing: .02em; text-decoration: none; }
  .brand .logo { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: linear-gradient(135deg, var(--accent), var(--accent2)); box-shadow: 0 6px 20px -6px var(--accent); }
  .brand img { width: 40px; height: 40px; border-radius: 50%; background: #fff; box-shadow: 0 6px 20px -8px var(--accent); }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 2.2rem; backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%);
    box-shadow: 0 30px 80px -30px rgba(0,0,0,.7);
  }
  h1 { font-size: clamp(1.7rem, 4vw, 2.3rem); line-height: 1.15; margin: 0 0 .8rem; letter-spacing: -.02em;
       background: linear-gradient(90deg, #fff 30%, #ffc2dc 75%, #ff8fbd); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .lead { color: var(--muted); margin: 0 0 1.6rem; }
  .features { list-style: none; padding: 0; margin: 0 0 1.8rem; display: grid; gap: .7rem; }
  .features li { display: flex; gap: .8rem; align-items: flex-start; }
  .features .ic { flex: none; width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: rgba(220,0,103,.16); color: #ff7aae; }
  .features b { display: block; font-weight: 600; }
  .features span { color: var(--muted); font-size: .92rem; }

  .dur { display: grid; grid-template-columns: repeat(var(--n, 3), 1fr); gap: .4rem; padding: .35rem; margin-bottom: 1rem; border-radius: 14px; background: rgba(0,0,0,.28); border: 1px solid var(--line); }
  .dur button { border: 0; border-radius: 10px; padding: .6rem .4rem; font: inherit; font-weight: 600; color: var(--muted); background: transparent; cursor: pointer; transition: all .2s; }
  .dur button:hover { color: var(--text); }
  .dur button[aria-pressed="true"] { color: #fff; background: rgba(255,255,255,.1); box-shadow: inset 0 0 0 1px rgba(255,255,255,.12), 0 4px 14px -6px rgba(220,0,103,.7); }
  .durlabel { font-size: .8rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 .45rem .2rem; }
  .tabs { display: inline-flex; gap: .25rem; padding: .25rem; margin-bottom: 1.4rem; border-radius: 99px; background: rgba(0,0,0,.28); border: 1px solid var(--line); }
  .tabs button { border: 0; border-radius: 99px; padding: .4rem 1rem; font: inherit; font-size: .88rem; font-weight: 600; color: var(--muted); background: transparent; cursor: pointer; transition: all .2s; }
  .tabs button[aria-selected="true"] { color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent2)); }
  #extendBox { display: none; margin-bottom: 1rem; }
  #extendBox input { width: 100%; background: rgba(0,0,0,.3); color: #cfd6e6; border: 1px solid var(--line); border-radius: 12px; padding: .8rem .9rem; font: .85rem ui-monospace, SFMono-Regular, Menlo, monospace; outline: none; transition: border-color .2s; }
  #extendBox input:focus { border-color: var(--accent); }
  #extendBox small { display: block; color: var(--muted); margin-top: .45rem; font-size: .84rem; }
  .btn {
    position: relative; width: 100%; border: 0; border-radius: 14px; padding: 1rem 1.2rem; font: inherit; font-weight: 650; font-size: 1.05rem;
    color: #fff; cursor: pointer; background: linear-gradient(135deg, var(--accent), var(--accent2));
    box-shadow: 0 12px 30px -10px rgba(220,0,103,.8); transition: transform .15s, box-shadow .15s, opacity .2s;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 16px 36px -10px rgba(220,0,103,.95); }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { cursor: default; opacity: .6; transform: none; }

  
  .bar { height: 8px; border-radius: 99px; background: rgba(255,255,255,.07); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--accent), var(--accent2), var(--sun)); background-size: 200% 100%; animation: shine 1.2s linear infinite; transition: width .2s; }
  @keyframes shine { to { background-position: -200% 0; } }
  .worklabel { display: flex; justify-content: space-between; color: var(--muted); font-size: .85rem; margin-top: .55rem; font-variant-numeric: tabular-nums; }
  

  #result { display: none; animation: rise .45s cubic-bezier(.2,.8,.2,1); }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } }
  .done { display: flex; align-items: center; gap: .7rem; margin-bottom: 1rem; }
  .done .check { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: rgba(47,209,138,.15); color: var(--ok); }
  .done h2 { margin: 0; font-size: 1.35rem; }
  .done p { margin: 0; color: var(--muted); font-size: .9rem; }
  .warn { display: flex; gap: .6rem; padding: .8rem 1rem; border-radius: 12px; background: rgba(255,181,71,.08); border: 1px solid rgba(255,181,71,.22); color: #ffd79a; font-size: .9rem; margin-bottom: 1.2rem; }
  .link { border: 1px solid var(--line); background: rgba(255,255,255,.025); border-radius: 14px; padding: 1rem; margin-bottom: .8rem; transition: border-color .2s; }
  .link:hover { border-color: rgba(255,255,255,.16); }
  .link header { display: flex; align-items: center; gap: .6rem; margin-bottom: .2rem; }
  .badge { font-size: .72rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: .18rem .55rem; border-radius: 99px; }
  .host .badge { background: rgba(220,0,103,.2); color: #ff8fbd; }
  .speaker .badge { background: rgba(245,196,0,.16); color: #ffd84d; }
  .guest .badge { background: rgba(255,255,255,.1); color: #d6dae0; }
  .link small { display: block; color: var(--muted); margin-bottom: .65rem; font-size: .86rem; }
  .field { display: flex; gap: .5rem; }
  .field input { flex: 1; min-width: 0; background: rgba(0,0,0,.3); color: #cfd6e6; border: 1px solid var(--line); border-radius: 10px; padding: .6rem .7rem; font: .8rem ui-monospace, SFMono-Regular, Menlo, monospace; text-overflow: ellipsis; }
  .icon-btn { flex: none; display: inline-flex; align-items: center; gap: .35rem; border: 1px solid var(--line); background: rgba(255,255,255,.06); color: var(--text); border-radius: 10px; padding: 0 .8rem; font: inherit; font-size: .85rem; cursor: pointer; text-decoration: none; transition: background .15s; }
  .icon-btn:hover { background: rgba(255,255,255,.12); }
  .icon-btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); border: 0; }
  .meta { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; margin-top: 1.2rem; color: var(--muted); font-size: .88rem; }
  .meta b { color: var(--text); font-weight: 600; }
  footer { text-align: center; margin-top: 1.4rem; color: var(--muted); font-size: .85rem; }
  footer a { color: var(--muted); }
  .link.manage { border-color: rgba(220,0,103,.4); background: linear-gradient(135deg, rgba(220,0,103,.1), rgba(255,77,148,.05)); }
  .manage .badge { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; }
  .panel { margin-top: 1.4rem; padding-top: 1.4rem; border-top: 1px solid var(--line); }
  .panel h3 { margin: 0 0 .3rem; font-size: 1.05rem; }
  .panel p { margin: 0 0 1rem; color: var(--muted); font-size: .88rem; }
  .expired { display: none; padding: .8rem 1rem; border-radius: 12px; background: rgba(255,80,80,.1); border: 1px solid rgba(255,80,80,.25); color: #ffb3b3; font-size: .9rem; margin-bottom: 1.2rem; }
  .err { display: none; margin-top: 1rem; padding: .8rem 1rem; border-radius: 12px; background: rgba(255,80,80,.1); border: 1px solid rgba(255,80,80,.25); color: #ffb3b3; }
  .work { display: none; margin-top: 1.1rem; }
  .loading { text-align: center; color: var(--muted); padding: 2rem 0; }
  #toast { position: fixed; left: 50%; bottom: 2rem; transform: translate(-50%, 30px); opacity: 0; background: #2a2f38; border: 1px solid var(--line); padding: .6rem 1rem; border-radius: 99px; font-size: .9rem; transition: all .25s; pointer-events: none; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  @media (max-width: 520px) { .card { padding: 1.4rem; } .field { flex-wrap: wrap; } .field input { flex-basis: 100%; } }
  @media (prefers-reduced-motion: reduce) { .blob, .bar i { animation: none; } }
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<main>
  <div class="top">
    <a class="brand" href="/">
      <img src="logo.png" alt="">
      FFMUC Meet
    </a>
    <nav id="langs" aria-label="Language"></nav>
  </div>

  <div class="card">
    <section id="loading" class="loading" style="display:none" data-i18n="loading"></section>

    <section id="start">
      <div class="tabs" role="tablist">
        <button role="tab" id="tabNew" aria-selected="true" data-i18n="tabNew"></button>
        <button role="tab" id="tabExt" aria-selected="false" data-i18n="tabManage"></button>
      </div>
      <div id="newPane">
        <h1 data-i18n="title"></h1>
        <p class="lead" data-i18n="intro"></p>
        <ul class="features">
          <li><span class="ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15l-3.5 2 1-4-3-2.7 4-.3L12 6l1.5 4 4 .3-3 2.7 1 4z"/></svg></span>
            <div><b data-i18n="f1t"></b><span data-i18n="f1d"></span></div></li>
          <li><span class="ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 11V8a5 5 0 0 1 10 0"/><path d="M12 14v3"/><rect x="4" y="11" width="16" height="10" rx="2"/></svg></span>
            <div><b data-i18n="f2t"></b><span data-i18n="f2d"></span></div></li>
          <li><span class="ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>
            <div><b data-i18n="f3t"></b><span data-i18n="f3d"></span></div></li>
        </ul>
        <div class="durlabel" data-i18n="durL"></div>
        <div class="dur" id="durNew" role="group"></div>
        <button class="btn" id="goNew" data-i18n="button"></button>
        <div class="work" id="workNew"><div class="bar"><i></i></div><div class="worklabel"><span data-i18n="working"></span><span class="rate"></span></div></div>
        <div class="err" id="errNew"></div>
      </div>
      <div id="extPane" style="display:none">
        <h1 data-i18n="openTitle"></h1>
        <p class="lead" data-i18n="openIntro"></p>
        <div id="extendBox" style="display:block">
          <input id="extIn" type="url" autocomplete="off" spellcheck="false">
          <small data-i18n="openHint"></small>
        </div>
        <button class="btn" id="goOpen" data-i18n="openButton"></button>
        <div class="err" id="errOpen"></div>
      </div>
    </section>

    <section id="result">
      <div class="done">
        <span class="check" id="doneIcon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
        <div><h2 id="doneT"></h2><p id="doneD"></p></div>
      </div>
      <div class="warn" id="warn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex:none;margin-top:2px"><path d="M12 9v4M12 17h.01M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg><span data-i18n="warn"></span></div>
      <div class="expired" id="expiredNote" data-i18n="expiredNote"></div>

      <div class="link manage"><header><span class="badge" data-i18n="manageL"></span></header><small data-i18n="manageD"></small>
        <div class="field"><input id="manage" readonly><button class="icon-btn" data-copy="manage" data-i18n="copy"></button></div></div>
      <div class="link host"><header><span class="badge" data-i18n="hostL"></span></header><small data-i18n="hostD"></small>
        <div class="field"><input id="host" readonly><button class="icon-btn" data-copy="host" data-i18n="copy"></button><a class="icon-btn primary" id="open" target="_blank" rel="noopener noreferrer" data-i18n="open"></a></div></div>
      <div class="link speaker"><header><span class="badge" data-i18n="speakerL"></span></header><small data-i18n="speakerD"></small>
        <div class="field"><input id="speaker" readonly><button class="icon-btn" data-copy="speaker" data-i18n="copy"></button></div></div>
      <div class="link guest"><header><span class="badge" data-i18n="guestL"></span></header><small data-i18n="guestD"></small>
        <div class="field"><input id="guest" readonly><button class="icon-btn" data-copy="guest" data-i18n="copy"></button></div></div>

      <div class="meta">
        <span><span data-i18n="expires"></span> <b id="expires"></b></span>
        <button class="icon-btn" id="copyall" style="padding:.5rem .8rem" data-i18n="copyall"></button>
      </div>

      <div class="panel" id="extendPanel">
        <h3 data-i18n="extTitle"></h3>
        <p id="extInfo"></p>
        <div class="dur" id="durExt" role="group"></div>
        <button class="btn" id="goExt" data-i18n="extButton"></button>
        <div class="work" id="workExt"><div class="bar"><i></i></div><div class="worklabel"><span data-i18n="working"></span><span class="rate"></span></div></div>
        <div class="err" id="errExt"></div>
      </div>
    </section>
  </div>
  <footer><a href="#" id="newLink" style="display:none" data-i18n="another"></a><span id="sep" style="display:none"> · </span><a href="https://ffmuc.net" target="_blank" rel="noopener">Freifunk München</a> · <a href="https://ffmuc.net/impressum/" target="_blank" rel="noopener" data-i18n="imprint"></a> · <a href="https://ffmuc.net/privacy/" target="_blank" rel="noopener" data-i18n="privacy"></a></footer>
</main>
<div id="toast"></div>
<script>
"use strict";
const durText = {
  de: (h) => h % 168 === 0 ? (h / 168 === 1 ? "1 Woche" : h / 168 + " Wochen") : h % 24 === 0 ? (h / 24 === 1 ? "1 Tag" : h / 24 + " Tage") : h + " Std.",
  en: (h) => h % 168 === 0 ? (h / 168 === 1 ? "1 week" : h / 168 + " weeks") : h % 24 === 0 ? (h / 24 === 1 ? "1 day" : h / 24 + " days") : h + " h",
  fr: (h) => h % 168 === 0 ? (h / 168 === 1 ? "1 semaine" : h / 168 + " semaines") : h % 24 === 0 ? (h / 24 === 1 ? "1 jour" : h / 24 + " jours") : h + " h",
  es: (h) => h % 168 === 0 ? (h / 168 === 1 ? "1 semana" : h / 168 + " semanas") : h % 24 === 0 ? (h / 24 === 1 ? "1 día" : h / 24 + " días") : h + " h",
  uk: (h) => {
    const pl = (n, one, few, many) => n % 10 === 1 && n % 100 !== 11 ? one : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20) ? few : many;
    if (h % 168 === 0) { const n = h / 168; return n + " " + pl(n, "тиждень", "тижні", "тижнів"); }
    if (h % 24 === 0) { const n = h / 24; return n + " " + pl(n, "день", "дні", "днів"); }
    return h + " год";
  },
};
const T = {
  de: {
    loading: "Lade Raum …",
    tabNew: "Neuer Raum", tabManage: "Raum verwalten",
    title: "Dein Zuschauerraum, in Sekunden.",
    intro: "Für Vorträge, Streams und Versammlungen: Du moderierst, alle anderen schauen zu. Ohne Konto, ohne Anmeldung.",
    f1t: "Du hast die Kontrolle", f1d: "Zuschauer melden sich per Handheben, du holst sie aufs Podium.",
    f2t: "Kein Raumname-Raten", f2d: "Der Name ist zufällig und kryptografisch signiert.",
    f3t: "Läuft von selbst ab", f3d: "Nach einem Tag, drei Tagen oder einer Woche, verlängerbar. Wir speichern nichts.",
    durL: "Laufzeit", button: "Raum erstellen",
    working: "Kurzer Rechencheck gegen Spam …",
    failed: "Das hat nicht geklappt: ",
    openTitle: "Raum verwalten",
    openIntro: "Füge deinen Verwaltungs- oder Moderationslink ein, um alle Links wieder anzuzeigen oder den Raum zu verlängern.",
    openHint: "Der Zuschauerlink reicht dafür nicht.",
    openButton: "Raum öffnen", openEmpty: "bitte einen Link einfügen",
    createdT: "Dein Raum ist bereit", createdD: "Drei Links, drei Rollen.",
    extendedT: "Raum verlängert", extendedD: "Der Zuschauerlink bleibt gleich. Verwaltungs-, Moderations- und Sprecherlink sind neu.",
    manageT: "Dein Raum", manageD: "Alle Links auf einen Blick.",
    warn: "Speichere den Verwaltungslink. Wir speichern nichts und können ihn nicht wiederherstellen.",
    expiredNote: "Dieser Raum ist abgelaufen. Verlängere ihn, um ihn wieder zu nutzen.",
    manageL: "Verwalten", manageD: "Lesezeichen setzen! Bringt dich hierher zurück, zeigt alle Links und lässt dich verlängern.",
    hostL: "Moderation", hostD: "Nur für dich. Wer diesen Link hat, moderiert den Raum.",
    speakerL: "Sprecher", speakerD: "Für Leute, die direkt mitreden sollen, ohne Moderationsrechte.",
    guestL: "Zuschauer", guestD: "Zum Teilen mit allen anderen. Bleibt beim Verlängern gleich.",
    copy: "Kopieren", open: "Öffnen", copied: "In die Zwischenablage kopiert",
    copyall: "Alle Links kopieren", expires: "Gültig bis",
    extTitle: "Verlängern", extButton: "Raum verlängern",
    extInfo: (d) => `Verlängern ist bis ${d} möglich. Danach brauchst du einen neuen Raum.`,
    extNo: "Dieser Raum kann nicht weiter verlängert werden.",
    another: "Neuen Raum erstellen", imprint: "Impressum", privacy: "Datenschutz",
    allText: (r, e) => `Verwalten: ${r.manage_url}\n\nModeration: ${r.host_url}\n\nSprecher: ${r.speaker_url}\n\nZuschauer: ${r.guest_url}\n\nGültig bis ${e}`,
  },
  en: {
    loading: "Loading room …",
    tabNew: "New room", tabManage: "Manage room",
    title: "Your viewers-only room, in seconds.",
    intro: "For talks, streams and assemblies: you moderate, everyone else watches. No account, no sign-up.",
    f1t: "You're in control", f1d: "Viewers raise their hand, you bring them on stage.",
    f2t: "No guessable names", f2d: "The room name is random and cryptographically signed.",
    f3t: "Expires on its own", f3d: "After a day, three days or a week, and you can extend it. We store nothing.",
    durL: "Duration", button: "Create room",
    working: "Quick anti-spam check …",
    failed: "That didn't work: ",
    openTitle: "Manage a room",
    openIntro: "Paste your manage or host link to see all links again or extend the room.",
    openHint: "The viewer link isn't enough for this.",
    openButton: "Open room", openEmpty: "please paste a link",
    createdT: "Your room is ready", createdD: "Three links, three roles.",
    extendedT: "Room extended", extendedD: "The viewer link stays the same. Manage, host and speaker links are new.",
    manageT: "Your room", manageD: "All links at a glance.",
    warn: "Save the manage link. We store nothing and can't recover it.",
    expiredNote: "This room has expired. Extend it to use it again.",
    manageL: "Manage", manageD: "Bookmark this! It brings you back here, shows all links and lets you extend.",
    hostL: "Host", hostD: "Only for you. Whoever has this link moderates the room.",
    speakerL: "Speaker", speakerD: "For people who should talk directly, without moderator rights.",
    guestL: "Viewer", guestD: "Share this with everyone else. Stays the same when you extend.",
    copy: "Copy", open: "Open", copied: "Copied to clipboard",
    copyall: "Copy all links", expires: "Valid until",
    extTitle: "Extend", extButton: "Extend room",
    extInfo: (d) => `You can extend until ${d}. After that you'll need a new room.`,

const LANGS = { de: "DE", en: "EN", fr: "FR", es: "ES", uk: "UA" };
function pickLang() {
  const q = new URLSearchParams(location.search).get("lang");
  let saved = null; try { saved = localStorage.getItem("ffmuc-reserve-lang"); } catch (e) {}
  const norm = (l) => { l = (l || "").toLowerCase().slice(0, 2); return l === "ua" ? "uk" : l; };
  for (const c of [q, saved, ...(navigator.languages || [navigator.language])]) {
    const hit = Object.keys(LANGS).find(k => k === norm(c));
    if (hit) return hit;
  }
  return "en";
}
const lang = pickLang();
const t = T[lang];
document.documentElement.lang = lang;
document.title = "FFMUC Meet – " + t.title;
document.querySelectorAll("[data-i18n]").forEach(e => e.textContent = t[e.dataset.i18n]);
Object.entries(LANGS).forEach(([k, label]) => {
  const b = document.createElement("button");
  b.type = "button"; b.textContent = label; b.setAttribute("aria-pressed", k === lang);
  b.onclick = () => { try { localStorage.setItem("ffmuc-reserve-lang", k); } catch (e) {} location.reload(); };
  $("langs").append(b);
});
$("extIn").placeholder = "https://meet.ffmuc.net/reserve/#m=…";

function $(id) { return document.getElementById(id); }
const base = location.pathname.replace(/\/+$/, "");
const fmt = (iso) => new Date(iso).toLocaleString(lang, { dateStyle: "medium", timeStyle: "short" });
const show = (id, on, disp = "block") => { $(id).style.display = on ? disp : "none"; };
let result = null, challenge = null, durations = [24, 72, 168], defaultHours = 72;
const picked = { durNew: 0, durExt: 0 };

function toast(msg) {
  const el = $("toast"); el.textContent = msg; el.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), 1600);
}
function fail(id, msg) { $(id).textContent = t.failed + msg; show(id, true); }

function renderDurations(boxId) {
  const box = $(boxId); box.innerHTML = ""; box.style.setProperty("--n", durations.length);
  if (!durations.includes(picked[boxId])) picked[boxId] = durations.includes(defaultHours) ? defaultHours : durations[0];
  durations.forEach(h => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = durText[lang](h); b.setAttribute("aria-pressed", h === picked[boxId]);
    b.onclick = () => { picked[boxId] = h; box.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); };
    box.append(b);
  });
}
async function fetchChallenge() {
  const c = await (await fetch(base + "/api/challenge", { cache: "no-store" })).json();
  if (c.durations) durations = c.durations;
  if (c.default) defaultHours = c.default;
  renderDurations("durNew"); renderDurations("durExt");
  return c;
}
function prefetch() { challenge = fetchChallenge().catch(() => null); }

const workerSrc = `
self.onmessage = async (e) => {
  const { challenge, difficulty, start, step } = e.data;
  const enc = new TextEncoder();
  const full = difficulty >> 3, rest = difficulty & 7, mask = (0xff << (8 - rest)) & 0xff;
  const ok = (h) => {
    for (let i = 0; i < full; i++) if (h[i] !== 0) return false;
    return rest === 0 || (h[full] & mask) === 0;
  };
  const batch = 512;
  for (let n = start; ; n += step * batch) {
    const ps = [];
    for (let i = 0; i < batch; i++) ps.push(crypto.subtle.digest("SHA-256", enc.encode(challenge + ":" + (n + i * step))));
    const hs = await Promise.all(ps);
    for (let i = 0; i < batch; i++) {
      if (ok(new Uint8Array(hs[i]))) { self.postMessage({ nonce: String(n + i * step) }); return; }
    }
    self.postMessage({ count: batch });
  }
};`;

function solve(challenge, difficulty, onProgress) {
  if (difficulty === 0) return Promise.resolve("0");
  const n = Math.max(1, Math.min(navigator.hardwareConcurrency || 2, 8));
  const url = URL.createObjectURL(new Blob([workerSrc], { type: "text/javascript" }));
  const expected = 2 ** difficulty, t0 = performance.now();
  let hashes = 0;
  return new Promise((resolve, reject) => {
    const ws = [];
    const stop = () => { ws.forEach(w => w.terminate()); URL.revokeObjectURL(url); };
    for (let i = 0; i < n; i++) {
      const w = new Worker(url);
      w.onmessage = (e) => {
        if (e.data.nonce !== undefined) { stop(); onProgress(1, hashes, t0); resolve(e.data.nonce); return; }
        hashes += e.data.count;
        onProgress(1 - Math.exp(-hashes / expected), hashes, t0);
      };
      w.onerror = (e) => { stop(); reject(new Error(e.message || "worker error")); };
      w.postMessage({ challenge, difficulty, start: i, step: n });
      ws.push(w);
    }
  });
}

// Solves the proof of work and POSTs to /api/reserve. extend = host token or "".
async function reserve(workId, hours, extend) {
  const work = $(workId), bar = work.querySelector("i"), rate = work.querySelector(".rate");
  bar.style.width = "0"; rate.textContent = ""; work.style.display = "block";
  try {
    let c = await challenge; challenge = null;
    if (!c) c = await fetchChallenge();
    const nonce = await solve(c.challenge, c.difficulty, (p, h, t0) => {
      bar.style.width = (p === 1 ? 100 : Math.min(p, .98) * 100).toFixed(1) + "%";
      const s = (performance.now() - t0) / 1000;
      if (s > .2) rate.textContent = Math.round(h / s / 1000) + "k H/s";
    });
    const r = await fetch(base + "/api/reserve", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ challenge: c.challenge, nonce, hours, extend }),
    });
    const j = await r.json().catch(() => ({ error: "HTTP " + r.status }));
    if (!r.ok) throw new Error(r.status === 429 ? (lang === "de" ? "zu viele Anfragen, bitte später nochmal" : "too many requests, try again later") : (j.error || "HTTP " + r.status));
    return j;
  } finally {
    work.style.display = "none";
    prefetch();
  }
}

async function loadLinks(link) {
  const r = await fetch(base + "/api/links", {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ host: link }),
  });
  const j = await r.json().catch(() => ({ error: "HTTP " + r.status }));
  if (!r.ok) throw new Error(j.error || "HTTP " + r.status);
  return j;
}

function showRoom(j, kind) {
  result = j;
  const now = Date.now(), expired = new Date(j.expires) <= now, canExtend = new Date(j.extendable_until) > now;
  $("doneT").textContent = t[kind + "T"]; $("doneD").textContent = t[kind + "D"];
  show("doneIcon", !expired, "grid");
  show("warn", kind !== "manage", "flex");
  show("expiredNote", expired);
  ["manage", "host", "speaker", "guest"].forEach(k => $(k).value = j[k + "_url"]);
  $("open").href = j.host_url;
  $("expires").textContent = fmt(j.expires);
  $("extInfo").textContent = canExtend ? t.extInfo(fmt(j.extendable_until)) : t.extNo;
  show("durExt", canExtend, "grid"); show("goExt", canExtend); show("errExt", false);
  history.replaceState(null, "", base + "/#m=" + j.manage_url.split("#m=")[1]);
  show("loading", false); show("start", false); show("result", true);
  show("newLink", true, "inline"); show("sep", true, "inline");
  $("result").style.animation = "none"; void $("result").offsetWidth; $("result").style.animation = "";
}

function setTab(ext) {
  $("tabNew").setAttribute("aria-selected", !ext); $("tabExt").setAttribute("aria-selected", ext);
  show("newPane", !ext); show("extPane", ext);
  if (ext) $("extIn").focus();
}
$("tabNew").onclick = () => setTab(false);
$("tabExt").onclick = () => setTab(true);

$("goNew").onclick = async () => {
  show("errNew", false); $("goNew").disabled = true;
  try { showRoom(await reserve("workNew", picked.durNew, ""), "created"); }
  catch (e) { fail("errNew", e.message); }
  finally { $("goNew").disabled = false; }
};
$("goOpen").onclick = async () => {
  show("errOpen", false);
  const v = $("extIn").value.trim();
  if (!v) return fail("errOpen", t.openEmpty);
  $("goOpen").disabled = true;
  try { showRoom(await loadLinks(v), "manage"); }
  catch (e) { fail("errOpen", e.message); }
  finally { $("goOpen").disabled = false; }
};
$("extIn").addEventListener("keydown", (e) => { if (e.key === "Enter") $("goOpen").click(); });
$("goExt").onclick = async () => {
  show("errExt", false); $("goExt").disabled = true;
  try { showRoom(await reserve("workExt", picked.durExt, result.host_url), "extended"); }
  catch (e) { fail("errExt", e.message); }
  finally { $("goExt").disabled = false; }
};
$("newLink").onclick = (e) => {
  e.preventDefault(); history.replaceState(null, "", base + "/");
  show("result", false); show("start", true); show("newLink", false); show("sep", false); setTab(false);
};

async function copy(text) {
  try { await navigator.clipboard.writeText(text); }
  catch { const a = document.createElement("textarea"); a.value = text; document.body.append(a); a.select(); document.execCommand("copy"); a.remove(); }
  toast(t.copied);
}
document.querySelectorAll("[data-copy]").forEach(b => b.addEventListener("click", () => copy($(b.dataset.copy).value)));
$("copyall").onclick = () => result && copy(t.allText(result, fmt(result.expires)));

renderDurations("durNew"); renderDurations("durExt");
prefetch();
if (location.hash.startsWith("#m=")) {
  show("start", false); show("loading", true);
  loadLinks(location.hash).then(j => showRoom(j, "manage")).catch(e => {
    show("loading", false); show("start", true); setTab(true);
    $("extIn").value = location.href; fail("errOpen", e.message);
  });
}
